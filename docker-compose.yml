services:
  tgfs:
    image: ${TGFS_IMAGE:-andyskaura/mifun-storage:latest}
    container_name: tgfs
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - tgfs_data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # 可选的自动更新服务。默认不会启动，启用方式见 README。
  watchtower:
    image: containrrr/watchtower:latest
    container_name: tgfs-watchtower
    restart: unless-stopped
    profiles:
      - auto-update
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "3600"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  tgfs_data:
    name: tgfs_data
