<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>存储统计 · 米饭云盘</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="stylesheet" href="/tailwind.css">
  <script>
    (() => {
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('tgfs-theme') === 'dark' ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --page: #f3f6fb;
      --surface: rgba(255,255,255,.78);
      --surface-solid: #fff;
      --line: rgba(15,23,42,.09);
      --text: #172033;
      --muted: #6b7485;
      --grid: rgba(100,116,139,.13);
      --shadow: 0 24px 70px rgba(48,59,82,.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --page: #080d18;
      --surface: rgba(16,24,40,.76);
      --surface-solid: #101827;
      --line: rgba(255,255,255,.09);
      --text: #edf2ff;
      --muted: #8f9bad;
      --grid: rgba(148,163,184,.11);
      --shadow: 0 28px 80px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 18% -10%, rgba(79,70,229,.18), transparent 36rem),
        radial-gradient(circle at 91% 14%, rgba(14,165,233,.14), transparent 30rem),
        var(--page);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: color .2s ease, background-color .2s ease;
    }
    button, a { font: inherit; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 52px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 42px; }
    .brand, .actions { display: flex; align-items: center; gap: 11px; }
    .brand-icon { width: 35px; height: 35px; border-radius: 11px; box-shadow: 0 8px 22px rgba(79,70,229,.2); }
    .brand strong { font-size: 14px; letter-spacing: -.01em; }
    .brand span { color: var(--muted); font-size: 12px; }
    .button {
      display: inline-flex; min-height: 38px; align-items: center; gap: 7px; padding: 0 13px;
      border: 1px solid var(--line); border-radius: 11px; color: var(--text); background: var(--surface);
      text-decoration: none; cursor: pointer; box-shadow: 0 5px 18px rgba(15,23,42,.04);
      backdrop-filter: blur(16px); transition: transform .16s ease, border-color .16s ease;
    }
    .button:hover { transform: translateY(-1px); border-color: rgba(99,102,241,.4); }
    .hero { display: grid; grid-template-columns: minmax(0,1fr) minmax(340px,.72fr); align-items: center; gap: 52px; margin-bottom: 34px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; color: #6366f1; font-size: 12px;
      font-weight: 750; letter-spacing: .12em; text-transform: uppercase;
    }
    .pulse { width: 7px; height: 7px; border-radius: 99px; background: #22c55e; box-shadow: 0 0 0 5px rgba(34,197,94,.12); }
    h1 { max-width: 690px; margin: 14px 0 15px; font-size: clamp(38px, 6vw, 67px); line-height: .99; letter-spacing: -.055em; }
    .hero p { max-width: 620px; margin: 0; color: var(--muted); font-size: 16px; line-height: 1.75; }
    .total-card-wrap { position: relative; min-width: 0; }
    .total-card {
      position: relative; min-height: 250px; overflow: hidden; padding: 28px;
      border: 1px solid rgba(99,102,241,.2); border-radius: 26px;
      background: linear-gradient(145deg, rgba(99,102,241,.12), transparent 56%), var(--surface);
      box-shadow: var(--shadow); backdrop-filter: blur(22px); isolation: isolate;
    }
    .total-card::after {
      position: absolute; width: 240px; height: 240px; right: -80px; bottom: -110px;
      border-radius: 50%; background: rgba(14,165,233,.12); filter: blur(9px); content: "";
    }
    .total-label { position: relative; z-index: 2; color: var(--muted); font-size: 13px; }
    .total-number {
      position: relative; z-index: 2; display: flex; height: 1em; align-items: center; margin-top: 18px;
      font-size: clamp(54px,8vw,88px); font-weight: 760; line-height: 1; letter-spacing: 0;
      font-variant-numeric: tabular-nums;
    }
    .digit-wheel {
      display: inline-block; width: .62em; height: 1em; overflow: hidden;
      margin-right: -.055em; vertical-align: top;
    }
    .digit-track {
      display: flex; flex-direction: column; width: 100%; will-change: transform;
      transform: translate3d(0,0,0);
    }
    .digit-track > span {
      display: block; width: 100%; height: 1em; flex: 0 0 1em;
      line-height: 1; text-align: center;
    }
    .digit-separator { display: inline-block; width: .27em; height: 1em; line-height: .82; text-align: center; }
    .total-foot { position: relative; z-index: 2; display: flex; gap: 18px; margin-top: 19px; color: var(--muted); font-size: 12px; }
    .total-foot b { margin-right: 5px; color: var(--text); font-size: 15px; }
    .history-trigger {
      position: absolute; z-index: 4; right: 22px; bottom: 20px; display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted);
      background: var(--surface-solid); cursor: default; font-size: 11px; font-weight: 650;
    }
    .history-popover {
      position: absolute; z-index: 40; right: 12px; top: calc(100% - 18px); width: min(390px, calc(100vw - 42px));
      padding: 13px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface-solid);
      box-shadow: 0 24px 65px rgba(15,23,42,.22); opacity: 0; visibility: hidden;
      transform: translateY(-6px) scale(.98); transform-origin: top right; pointer-events: none;
      transition: opacity .16s ease, transform .16s ease, visibility .16s ease;
    }
    .total-card-wrap:hover .history-popover,
    .total-card-wrap:focus-within .history-popover {
      opacity: 1; visibility: visible; transform: translateY(0) scale(1); pointer-events: auto;
    }
    .history-title { display: flex; justify-content: space-between; margin: 1px 2px 10px; font-size: 12px; font-weight: 720; }
    .history-title span { color: var(--muted); font-size: 10px; font-weight: 500; }
    .history-list { display: grid; max-height: 310px; gap: 6px; overflow: auto; }
    .history-item { padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: rgba(148,163,184,.04); }
    .history-path { overflow: hidden; color: var(--text); font-size: 11px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .history-meta { display: flex; flex-wrap: wrap; gap: 5px 10px; margin-top: 5px; color: var(--muted); font-size: 10px; }
    .history-format { color: #6366f1; font-weight: 700; }
    .history-empty { padding: 24px; color: var(--muted); text-align: center; font-size: 11px; }
    .total-increment {
      position: absolute; z-index: 3; top: 84px; left: 155px; color: #22c55e;
      font-size: 18px; font-weight: 780; pointer-events: none;
      animation: count-up 1.4s cubic-bezier(.16,1,.3,1) forwards;
    }
    @keyframes count-up {
      0% { opacity: 0; transform: translateY(12px) scale(.8); }
      24% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-38px) scale(1.08); }
    }
    .particle {
      position: absolute; z-index: 1; left: var(--x); bottom: -32px; padding: 5px 9px;
      border: 1px solid rgba(99,102,241,.22); border-radius: 999px; color: #6366f1;
      background: var(--surface-solid); box-shadow: 0 6px 18px rgba(79,70,229,.12);
      font-size: 11px; font-weight: 720; opacity: 0; pointer-events: none;
      animation: float-up var(--duration) cubic-bezier(.18,.7,.2,1) var(--delay) forwards;
    }
    @keyframes float-up {
      0% { opacity: 0; transform: translate3d(0,0,0) scale(.8) rotate(-5deg); }
      17% { opacity: 1; }
      78% { opacity: .88; }
      100% { opacity: 0; transform: translate3d(var(--drift),-225px,0) scale(1.06) rotate(5deg); }
    }
    .summary-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 15px; margin-bottom: 15px; }
    .metric, .panel {
      border: 1px solid var(--line); background: var(--surface); box-shadow: 0 12px 36px rgba(15,23,42,.055);
      backdrop-filter: blur(18px);
    }
    .metric { padding: 20px 22px; border-radius: 18px; }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { margin-top: 9px; font-size: 25px; font-weight: 720; letter-spacing: -.035em; }
    .charts { display: grid; grid-template-columns: 1.25fr .75fr; gap: 15px; }
    .panel { min-width: 0; padding: 23px; border-radius: 20px; }
    .panel-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .panel-title { font-size: 14px; font-weight: 700; }
    .panel-subtitle { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .chart-wrap { width: 100%; height: 260px; }
    .chart-wrap canvas { display: block; }
    .wide { grid-column: 1 / -1; }
    .cache-note { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; color: var(--muted); font-size: 11px; }
    .cache-pill { padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
    .skeleton { overflow: hidden; color: transparent !important; border-radius: 8px; background: linear-gradient(90deg,var(--grid),rgba(148,163,184,.2),var(--grid)); background-size: 220% 100%; animation: shimmer 1.4s infinite; }
    @keyframes shimmer { to { background-position: -220% 0; } }
    .error { display: none; margin: 18px 0; padding: 14px 16px; border: 1px solid rgba(239,68,68,.25); border-radius: 12px; color: #ef4444; background: rgba(239,68,68,.07); font-size: 13px; }
    @media (max-width: 820px) {
      .hero { grid-template-columns: 1fr; gap: 27px; }
      .charts { grid-template-columns: 1fr; }
      .wide { grid-column: auto; }
    }
    @media (max-width: 560px) {
      .shell { width: min(100% - 22px,1180px); padding-top: 16px; }
      .topbar { margin-bottom: 30px; }
      .brand span, .button span { display: none; }
      .summary-grid { grid-template-columns: 1fr; }
      .total-card { min-height: 225px; }
      .panel { padding: 18px; }
      .history-popover { right: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .particle { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar" aria-label="页面导航">
      <div class="brand">
        <img class="brand-icon" src="/icon.png" alt="">
        <div><strong>米饭云盘</strong><br><span>Storage observatory</span></div>
      </div>
      <div class="actions">
        <button class="button" id="theme-button" type="button" aria-label="切换主题">◐ <span>主题</span></button>
        <a class="button" href="/">← <span>返回文件</span></a>
      </div>
    </nav>

    <section class="hero">
      <div>
        <div class="eyebrow"><i class="pulse"></i>数据库统计快照</div>
        <h1>每一份文件，<br>都有迹可循。</h1>
        <p>从文件数量、空间体量到增长趋势，这里是米饭云盘的独立统计视图。</p>
      </div>
      <div class="total-card-wrap">
        <article class="total-card" id="total-card">
          <div class="total-label">文件总数</div>
          <div class="total-number skeleton" id="total-items" aria-live="polite">000</div>
          <div class="total-foot">
            <span><b id="total-files">—</b>文件</span>
            <span><b id="total-folders">—</b>文件夹</span>
          </div>
          <button class="history-trigger" type="button" aria-haspopup="true">↻ 历史新增</button>
        </article>
        <aside class="history-popover" aria-label="历史新增数据">
          <div class="history-title">历史新增 <span>最近 12 条</span></div>
          <div class="history-list" id="history-list" aria-live="polite"></div>
        </aside>
      </div>
    </section>

    <div class="error" id="error-box" role="alert"></div>

    <section class="summary-grid" aria-label="核心统计">
      <article class="metric"><div class="metric-label">已使用空间</div><div class="metric-value skeleton" id="total-size">加载中</div></article>
      <article class="metric"><div class="metric-label">平均大小</div><div class="metric-value skeleton" id="average-size">加载中</div></article>
      <article class="metric"><div class="metric-label">存储位置</div><div class="metric-value skeleton" id="location-count">加载中</div></article>
    </section>

    <section class="charts">
      <article class="panel">
        <div class="panel-head"><div><div class="panel-title">近 12 个月增长</div><div class="panel-subtitle">按创建时间汇总文件与文件夹</div></div></div>
        <div class="chart-wrap" id="growth-chart" aria-label="近十二个月增长折线图"></div>
      </article>
      <article class="panel">
        <div class="panel-head"><div><div class="panel-title">格式占比</div><div class="panel-subtitle">按扩展名统计的圆形饼图</div></div></div>
        <div class="chart-wrap" id="extension-chart" aria-label="扩展名环形图"></div>
      </article>
      <article class="panel wide">
        <div class="panel-head"><div><div class="panel-title">数量矩阵</div><div class="panel-subtitle">累计计算各文件夹及其所有子目录中的文件数量</div></div></div>
        <div class="chart-wrap" id="folder-chart" aria-label="文件夹累计文件数量矩形树图"></div>
      </article>
    </section>

    <div class="cache-note">
      <span id="cache-time">正在读取持久化缓存…</span>
      <span class="cache-pill" id="cache-status">CACHE</span>
    </div>
  </main>

  <script src="/vendor/echarts.min.js"></script>
  <script>
    const colors = ['#6366f1','#0ea5e9','#22c55e','#f59e0b','#f43f5e','#a855f7','#14b8a6','#94a3b8'];
    const charts = new Map();
    let activityCursor = '0';
    let liveTotals = null;
    let activityTimer = null;
    let recentActivity = [];
    let adminToken = '';
    let displayedTotal = 0;
    let totalRollVersion = 0;
    try { adminToken = sessionStorage.getItem('tgfs-admin-token') || ''; } catch {}

    document.getElementById('theme-button').addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('tgfs-theme', next); } catch {}
      renderAllCharts(window.statisticsData);
    });

    function formatNumber(value) {
      return new Intl.NumberFormat('zh-CN').format(value);
    }

    function animateTotalNumber(value, immediate = false) {
      const target = Math.max(0, Math.trunc(Number(value) || 0));
      const targetDigits = String(target);
      const previousDigits = String(displayedTotal)
        .padStart(targetDigits.length, '0')
        .slice(-targetDigits.length);
      const formatted = formatNumber(target);
      const container = document.getElementById('total-items');
      const version = ++totalRollVersion;
      container.replaceChildren();
      container.setAttribute('aria-label', formatted);

      let digitIndex = 0;
      formatted.split('').forEach((character) => {
          if (!/\d/.test(character)) {
          const separator = document.createElement('span');
          separator.className = 'digit-separator';
          separator.setAttribute('aria-hidden', 'true');
          separator.textContent = character;
          container.appendChild(separator);
          return;
        }

        const start = Number(previousDigits[digitIndex] || 0);
        const end = Number(targetDigits[digitIndex] || 0);
        const steps = immediate ? 0 : 10 + (end - start + 10) % 10;
        const wheel = document.createElement('span');
        const track = document.createElement('span');
        wheel.className = 'digit-wheel';
        track.className = 'digit-track';
        wheel.setAttribute('aria-hidden', 'true');
        for (let step = 0; step <= steps; step += 1) {
          const digit = document.createElement('span');
          digit.textContent = String((start + step) % 10);
          track.appendChild(digit);
        }
        wheel.appendChild(track);
        container.appendChild(wheel);

        if (steps > 0) {
          const delay = digitIndex * 58;
          const duration = 620 + steps * 28;
          track.style.transition = `transform ${duration}ms cubic-bezier(.16,1,.3,1) ${delay}ms`;
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              if (version === totalRollVersion) {
                track.style.transform = `translate3d(0,-${steps}em,0)`;
              }
            });
          });
        }
        digitIndex += 1;
      });
      displayedTotal = target;
    }

    function formatBytes(value) {
      const bytes = Number(value);
      if (!Number.isFinite(bytes) || bytes <= 0) return '0 B';
      const units = ['B','KB','MB','GB','TB','PB'];
      const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      const amount = bytes / Math.pow(1024, index);
      return `${amount.toLocaleString('zh-CN', { maximumFractionDigits: index ? 2 : 0 })} ${units[index]}`;
    }

    function removeSkeletons() {
      document.querySelectorAll('.skeleton').forEach((node) => node.classList.remove('skeleton'));
    }

    function emitActivityParticles(events, clear = false) {
      const card = document.getElementById('total-card');
      if (clear) {
        card.querySelectorAll('.particle').forEach((node) => node.remove());
      }
      events.slice(0, 12).forEach((event, index) => {
        const particle = document.createElement('span');
        particle.className = 'particle';
        particle.textContent = `+1 · ${event.name}`;
        const numericId = Number(event.id) || index;
        particle.style.setProperty('--x', `${10 + numericId * 37 % 74}%`);
        particle.style.setProperty('--drift', `${-30 + numericId * 19 % 60}px`);
        particle.style.setProperty('--duration', `${4 + numericId % 3 * .45}s`);
        particle.style.setProperty('--delay', `${index * .34}s`);
        particle.addEventListener('animationend', () => particle.remove(), { once: true });
        card.appendChild(particle);
      });
    }

    function emitTotalIncrements(count) {
      const card = document.getElementById('total-card');
      Array.from({ length: Math.min(count, 8) }, (_, index) => {
        const increment = document.createElement('span');
        increment.className = 'total-increment';
        increment.textContent = '+1';
        increment.style.animationDelay = `${index * .18}s`;
        increment.addEventListener('animationend', () => increment.remove(), { once: true });
        card.appendChild(increment);
      });
    }

    function statisticsHeaders() {
      return adminToken
        ? { accept: 'application/json', authorization: `Bearer ${adminToken}` }
        : { accept: 'application/json' };
    }

    function chartFor(id) {
      const target = document.getElementById(id);
      let chart = charts.get(id);
      if (!chart) {
        chart = echarts.init(target);
        charts.set(id, chart);
      }
      return chart;
    }

    function chartColors() {
      const styles = getComputedStyle(document.documentElement);
      return {
        text: styles.getPropertyValue('--text').trim(),
        muted: styles.getPropertyValue('--muted').trim(),
        grid: styles.getPropertyValue('--grid').trim()
      };
    }

    function renderGrowth(items) {
      const theme = chartColors();
      chartFor('growth-chart').setOption({
        animationDuration: 700,
        color: ['#6366f1', '#38bdf8'],
        tooltip: { trigger: 'axis' },
        legend: { top: 0, right: 0, textStyle: { color: theme.muted, fontSize: 10 } },
        grid: { left: 36, right: 12, top: 38, bottom: 26 },
        xAxis: {
          type: 'category',
          boundaryGap: false,
          data: items.map((item) => `${item.month.slice(5)}月`),
          axisLine: { lineStyle: { color: theme.grid } },
          axisTick: { show: false },
          axisLabel: { color: theme.muted, fontSize: 10 }
        },
        yAxis: {
          type: 'value',
          minInterval: 1,
          axisLabel: { color: theme.muted, fontSize: 10 },
          splitLine: { lineStyle: { color: theme.grid } }
        },
        series: [
          { name: '文件', type: 'line', smooth: .32, symbolSize: 6, data: items.map((item) => item.files), areaStyle: { opacity: .08 } },
          { name: '文件夹', type: 'line', smooth: .32, symbolSize: 5, data: items.map((item) => item.folders) }
        ]
      }, true);
    }

    function renderExtensions(items) {
      const theme = chartColors();
      const data = items.length
        ? items.map((item) => ({ name: item.label, value: item.count }))
        : [{ name: '暂无文件', value: 1, itemStyle: { color: theme.grid } }];
      chartFor('extension-chart').setOption({
        animationType: 'scale',
        animationDuration: 750,
        color: colors,
        tooltip: {
          trigger: 'item',
          formatter: items.length ? '{b}<br/>{c} 个 · {d}%' : '暂无文件'
        },
        legend: {
          type: 'scroll',
          bottom: 0,
          textStyle: { color: theme.muted, fontSize: 10 }
        },
        series: [{
          name: '格式占比',
          type: 'pie',
          radius: '66%',
          center: ['50%', '43%'],
          avoidLabelOverlap: true,
          itemStyle: { borderColor: getComputedStyle(document.body).backgroundColor, borderWidth: 2, borderRadius: 5 },
          label: { show: false },
          emphasis: { label: { show: true, formatter: '{b}\\n{d}%', color: theme.text, fontWeight: 700 } },
          data
        }]
      }, true);
    }

    function renderFolderTreemap(items) {
      const matrixRows = [[], []];
      const rowTotals = [0, 0];
      items.forEach((item) => {
        const rowIndex = rowTotals[0] <= rowTotals[1] ? 0 : 1;
        matrixRows[rowIndex].push({
          name: item.label,
          value: Math.max(1, item.fileCount),
          fileCount: item.fileCount
        });
        rowTotals[rowIndex] += Math.max(1, item.fileCount);
      });
      chartFor('folder-chart').setOption({
        animationDuration: 750,
        color: colors,
        tooltip: {
          formatter: (params) =>
            `${params.name}<br/>${formatNumber(params.data.fileCount)} 个文件`
        },
        series: matrixRows.map((data, rowIndex) => ({
          type: 'treemap',
          data,
          left: 0,
          top: `${rowIndex * 50}%`,
          width: '100%',
          height: '50%',
          roam: false,
          nodeClick: false,
          breadcrumb: { show: false },
          visibleMin: 1,
          label: {
            show: true,
            color: '#fff',
            formatter: (params) => `${params.name}\n${formatNumber(params.data.fileCount)} 个文件`
          },
          upperLabel: { show: false },
          itemStyle: { borderColor: 'rgba(255,255,255,.72)', borderWidth: 2, gapWidth: 2 },
          levels: [{ colorSaturation: [.35, .72], itemStyle: { borderRadius: 7 } }]
        }))
      }, true);
      if (!items.length) {
        chartFor('folder-chart').setOption({
          graphic: [{
            type: 'text',
            left: 'center',
            top: 'middle',
            style: { text: '暂无文件夹数据', fill: theme.muted, fontSize: 12 }
          }]
        });
      }
    }

    function renderRecentActivity(items) {
      const target = document.getElementById('history-list');
      if (!items.length) {
        target.innerHTML = '<div class="history-empty">暂无新增记录</div>';
        return;
      }
      target.innerHTML = `
        ${items.slice(0, 12).map((item) => `
          <div class="history-item">
            <div class="history-path" title="${escapeHtml(item.path)}">${escapeHtml(item.path)}</div>
            <div class="history-meta">
              <span class="history-format">${escapeHtml(item.type === 'folder' ? '文件夹' : item.extension || '无扩展名')}</span>
              <span>${item.type === 'folder' ? '—' : formatBytes(item.size)}</span>
              <time datetime="${escapeHtml(item.createdAt)}">${new Date(item.createdAt).toLocaleString('zh-CN')}</time>
            </div>
          </div>`).join('')}`;
    }

    function renderAllCharts(data) {
      if (!data) return;
      renderGrowth(data.monthlyGrowth);
      renderExtensions(data.extensionDistribution);
      renderFolderTreemap(data.folderFileMatrix);
    }

    function applyLiveActivity(events) {
      if (!events.length || !liveTotals) return;
      events.forEach((event) => {
        liveTotals.totalItems += 1;
        const month = event.createdAt.slice(0, 7);
        const monthBucket = window.statisticsData.monthlyGrowth.find((item) => item.month === month);
        if (event.type === 'folder') {
          liveTotals.totalFolders += 1;
          if (monthBucket) monthBucket.folders += 1;
          if (!window.statisticsData.folderFileMatrix.some((item) => item.id === event.id)) {
            window.statisticsData.folderFileMatrix.push({
              id: event.id,
              name: event.name,
              label: event.name,
              fileCount: 0
            });
          }
        }
        else {
          liveTotals.totalFiles += 1;
          liveTotals.totalBytes += Number(event.size);
          if (monthBucket) monthBucket.files += 1;
          const format = event.extension || '无扩展名';
          let formatBucket = window.statisticsData.extensionDistribution.find((item) => item.label === format);
          if (!formatBucket) {
            formatBucket = { label: format, count: 0 };
            window.statisticsData.extensionDistribution.push(formatBucket);
          }
          formatBucket.count += 1;
          (event.folderIds || []).forEach((folderId) => {
            const folder = window.statisticsData.folderFileMatrix.find((item) => item.id === folderId);
            if (folder) folder.fileCount += 1;
          });
        }
      });
      animateTotalNumber(liveTotals.totalItems);
      document.getElementById('total-files').textContent = formatNumber(liveTotals.totalFiles);
      document.getElementById('total-folders').textContent = formatNumber(liveTotals.totalFolders);
      document.getElementById('total-size').textContent = formatBytes(liveTotals.totalBytes);
      document.getElementById('average-size').textContent =
        formatBytes(liveTotals.totalFiles ? liveTotals.totalBytes / liveTotals.totalFiles : 0);
      emitActivityParticles(events);
      emitTotalIncrements(events.length);
      recentActivity = [...events.slice().reverse(), ...recentActivity]
        .filter((item, index, source) => source.findIndex((candidate) => candidate.id === item.id) === index)
        .slice(0, 12);
      renderRecentActivity(recentActivity);
      renderAllCharts(window.statisticsData);
    }

    async function pollActivity() {
      try {
        const response = await fetch(`/api/statistics/activity?after=${encodeURIComponent(activityCursor)}`, {
          cache: 'no-store',
          headers: statisticsHeaders()
        });
        if (!response.ok) return;
        const result = await response.json();
        activityCursor = result.cursor;
        applyLiveActivity(result.data);
      } finally {
        activityTimer = window.setTimeout(pollActivity, 5000);
      }
    }

    async function loadStatistics() {
      try {
        const response = await fetch('/api/statistics', {
          cache: 'no-store',
          headers: statisticsHeaders()
        });
        if (!response.ok) throw new Error(`统计接口返回 ${response.status}`);
        const result = await response.json();
        const data = result.data;
        window.statisticsData = data;
        recentActivity = data.recentActivity || [];
        activityCursor = data.lastItemId;
        liveTotals = {
          totalItems: data.totalItems,
          totalFiles: data.totalFiles,
          totalFolders: data.totalFolders,
          totalBytes: Number(data.totalBytes)
        };
        animateTotalNumber(data.totalItems);
        document.getElementById('total-files').textContent = formatNumber(data.totalFiles);
        document.getElementById('total-folders').textContent = formatNumber(data.totalFolders);
        document.getElementById('total-size').textContent = formatBytes(data.totalBytes);
        document.getElementById('average-size').textContent = formatBytes(data.totalFiles ? Number(data.totalBytes) / data.totalFiles : 0);
        document.getElementById('location-count').textContent = `${formatNumber(data.storageLocations)} 个`;
        removeSkeletons();
        document.querySelectorAll('#total-card .particle').forEach((node) => node.remove());
        renderRecentActivity(recentActivity);
        renderAllCharts(data);
        const generated = new Date(result.cache.generatedAt);
        document.getElementById('cache-time').textContent = `统计生成于 ${generated.toLocaleString('zh-CN')} · 15 分钟内复用`;
        document.getElementById('cache-status').textContent = result.cache.hit ? '缓存命中' : '已刷新';
        clearTimeout(activityTimer);
        activityTimer = window.setTimeout(pollActivity, 5000);
      } catch (error) {
        const box = document.getElementById('error-box');
        box.style.display = 'block';
        box.textContent = `暂时无法读取统计数据：${error.message}`;
        removeSkeletons();
      }
    }

    function escapeHtml(value) {
      const node = document.createElement('span');
      node.textContent = String(value);
      return node.innerHTML;
    }

    window.addEventListener('resize', () => charts.forEach((chart) => chart.resize()));
    loadStatistics();
  </script>
</body>
</html>
