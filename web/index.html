<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>米饭云盘-小文件tg存储系统</title>
  <link rel="icon" type="image/png" href="./icon.png" />
  <meta name="color-scheme" content="dark light" />
  <script>
    (() => {
      let theme = 'light';
      try {
        theme = localStorage.getItem('tgfs-theme') === 'light' ? 'light' : 'dark';
      } catch {
        // 无法访问本地存储时继续使用默认亮色主题。
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <!-- 引入本地 Tailwind CSS -->
  <script src="./tailwindcss.js"></script>
  <!-- 引入系统内置字体平滑与自定义微调样式 -->
  <style>
    :root {
      color-scheme: dark;
    }

    html[data-theme="light"] {
      color-scheme: light;
    }

    body,
    body > div,
    #content-area,
    #upload-panel,
    #download-panel,
    #context-menu,
    #delete-dialog > div,
    #folder-dialog > div,
    #admin-dialog > div,
    #image-preview-dialog > div,
    #storage-dialog > div,
    input,
    select {
      transition:
        background-color 200ms cubic-bezier(0.16, 1, 0.3, 1),
        border-color 200ms cubic-bezier(0.16, 1, 0.3, 1),
        color 200ms cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 200ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 自定义滚动条样式，使其符合 macOS 隐形滚动条体验 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 9999px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.35);
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      min-width: 4.6rem;
      justify-content: center;
    }

    .file-list-columns {
      display: grid;
      grid-template-columns:
        minmax(14rem, 2fr)
        minmax(9rem, 1fr)
        minmax(5.5rem, 0.55fr)
        minmax(5.5rem, 0.55fr);
      min-width: 42rem;
    }

    .context-tag-button {
      width: 1.125rem;
      height: 1.125rem;
      flex: none;
      opacity: 1;
    }

    .file-type-icon {
      --file-icon-color: #94a3b8;
      --file-icon-background: rgba(148, 163, 184, 0.16);
      position: relative;
      display: inline-flex;
      width: 2.75rem;
      height: 3.25rem;
      flex: none;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--file-icon-color);
      border-radius: 0.45rem;
      color: var(--file-icon-color);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.12), transparent 45%),
        var(--file-icon-background);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12),
        0 5px 12px rgba(0, 0, 0, 0.16);
      transition: transform 150ms ease, filter 150ms ease;
    }

    .file-type-icon::before {
      position: absolute;
      top: -1px;
      right: -1px;
      width: 0.9rem;
      height: 0.9rem;
      border-bottom: 1px solid var(--file-icon-color);
      border-left: 1px solid var(--file-icon-color);
      border-bottom-left-radius: 0.25rem;
      background: rgba(255, 255, 255, 0.13);
      content: "";
    }

    .file-type-icon-label {
      width: 100%;
      overflow: hidden;
      padding: 0.22rem 0.14rem;
      font-size: 0.55rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.03em;
      text-align: center;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
      background: var(--file-icon-background);
    }

    .group:hover .file-type-icon:not(.file-type-icon-compact) {
      filter: brightness(1.12);
      transform: scale(1.05);
    }

    .file-type-icon-compact {
      width: 1.5rem;
      height: 1.65rem;
      border-radius: 0.3rem;
      box-shadow: none;
    }

    .file-type-icon-compact::before {
      display: none;
    }

    .file-type-icon-compact .file-type-icon-label {
      padding: 0.2rem 0.08rem;
      font-size: 0.4rem;
      letter-spacing: 0;
    }

    html[data-theme="light"] .file-type-icon {
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7),
        0 4px 10px rgba(0, 0, 0, 0.1);
    }

    #current-folder-name {
      display: inline-block;
      min-width: 0;
      max-width: 12rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: middle;
    }

    .mobile-row-action {
      display: none;
    }

    @media (max-width: 639px) {
      html {
        height: 100%;
        overscroll-behavior: none;
      }

      body {
        height: 100dvh;
        padding: 0 !important;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }

      #app-window {
        height: 100dvh;
        max-height: 100dvh;
        border-radius: 0;
        border-width: 0;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }

      #app-toolbar {
        height: auto;
        flex-wrap: wrap;
        align-content: center;
        gap: 0.5rem 0.375rem;
        padding: 0.5rem 0.625rem;
      }

      #window-actions {
        width: auto;
        flex: none;
        gap: 0.375rem;
        padding-left: 0;
      }

      #window-actions > button {
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 0.75rem;
        border-width: 1px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      }

      #window-actions > button > span {
        font-size: 1rem;
        line-height: 1;
        opacity: 1;
      }

      #navigation-toolbar {
        min-width: 0;
        flex: 1;
        justify-content: flex-end;
        gap: 0.375rem;
      }

      #navigation-toolbar > div:first-child {
        height: 2.75rem;
        padding: 0.125rem;
      }

      #btn-back,
      #btn-forward {
        display: flex;
        width: 2.375rem;
        height: 2.375rem;
        align-items: center;
        justify-content: center;
      }

      #current-folder-name,
      #view-switcher {
        display: none;
      }

      #sort-select {
        min-width: 0;
        max-width: 7.5rem;
        height: 2.75rem;
        padding-right: 0.25rem;
        padding-left: 0.5rem;
        font-size: 0.75rem;
      }

      #toolbar-actions {
        width: 100%;
        min-width: 0;
        gap: 0.375rem;
      }

      #btn-admin-auth {
        min-height: 2.75rem;
        max-width: 6.5rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #theme-toggle {
        min-width: 2.75rem;
        width: 2.75rem;
        height: 2.75rem;
        padding-left: 0;
        padding-right: 0;
      }

      #theme-label {
        display: none;
      }

      #search-box {
        width: auto;
        min-width: 0;
        flex: 1;
      }

      #search-input {
        height: 2.75rem;
        font-size: 1rem;
      }

      #image-preview-dialog {
        height: 100dvh;
        align-items: stretch;
        padding-top: max(0.75rem, env(safe-area-inset-top));
        padding-right: max(0.75rem, env(safe-area-inset-right));
        padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
        padding-left: max(0.75rem, env(safe-area-inset-left));
      }

      #image-preview-dialog > div {
        height: 100%;
        max-height: 100%;
        border-radius: 0.75rem;
      }

      #image-preview-toolbar {
        position: relative;
        z-index: 1;
        flex: none;
      }

      #btn-image-preview-close {
        min-width: 2.5rem;
        min-height: 2.5rem;
      }

      #app-main {
        min-height: 0;
        flex-direction: column;
      }

      #app-sidebar {
        width: 100%;
        flex: none;
        flex-direction: row;
        gap: 0.375rem;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        scrollbar-width: none;
        scroll-snap-type: x proximity;
        border-right-width: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding: 0.45rem 0.625rem;
      }

      #app-sidebar::-webkit-scrollbar {
        display: none;
      }

      #app-sidebar > div {
        display: flex;
        flex: none;
        align-items: center;
        gap: 0.375rem;
      }

      #app-sidebar > div > div {
        display: none;
      }

      #sidebar-list,
      #tag-list {
        display: flex;
        align-items: center;
        gap: 0.375rem;
      }

      #sidebar-list > *,
      #tag-list > * {
        margin-top: 0 !important;
      }

      #sidebar-list li,
      #tag-list button {
        width: auto;
        min-height: 2.5rem;
        white-space: nowrap;
        scroll-snap-align: start;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background-color: rgba(255, 255, 255, 0.04);
        padding: 0.5rem 0.75rem;
      }

      #sidebar-list li.bg-blue-600\/90,
      #tag-list button.bg-blue-600\/90 {
        border-color: rgba(96, 165, 250, 0.5);
      }

      #content-area {
        padding: 0.375rem 0.5rem 0.75rem;
        overscroll-behavior-y: contain;
      }

      .file-list-columns {
        grid-template-columns: minmax(0, 1fr) minmax(5.75rem, auto);
        min-width: 0;
      }

      .file-list-columns > :nth-child(2),
      .file-list-columns > :nth-child(3) {
        display: none;
      }

      .file-list-columns[data-file-id] {
        min-height: 3.25rem;
        margin-bottom: 0.125rem;
        padding: 0.5rem 0.625rem;
        border: 1px solid transparent;
      }

      .file-list-columns[data-file-id]:active {
        background-color: rgba(59, 130, 246, 0.14);
      }

      .mobile-row-action {
        display: inline-flex !important;
        width: 2.75rem;
        height: 2.75rem;
        align-items: center;
        justify-content: center;
        flex: none;
        border-radius: 0.75rem;
        color: #94a3b8;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 1.125rem;
      }

      .file-size-label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #app-statusbar {
        height: auto;
        min-height: 2.5rem;
        gap: 0.5rem;
        padding-left: 0.625rem;
        padding-right: 0.625rem;
      }

      #breadcrumb-path {
        overflow: hidden;
      }

      #status-info {
        display: none;
      }

      #app-statusbar a {
        width: 2rem;
        height: 2rem;
      }

      #btn-download-selected {
        min-height: 2rem;
      }

      #context-menu {
        right: 0.5rem !important;
        bottom: max(0.5rem, env(safe-area-inset-bottom)) !important;
        left: 0.5rem !important;
        top: auto !important;
        width: auto;
        max-height: min(70dvh, 32rem);
        overflow-y: auto;
        border-radius: 1.25rem;
        padding: 0.5rem;
        box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.45);
      }

      #context-menu [data-menu-action] {
        min-height: 2.75rem;
        font-size: 0.875rem;
      }

      #context-menu [data-menu-action] span:last-child {
        display: none;
      }

      #context-tag-options {
        grid-template-columns: repeat(8, minmax(0, 1fr));
      }

      .context-tag-button {
        width: 1.75rem;
        height: 1.75rem;
      }

      #admin-dialog,
      #delete-dialog,
      #folder-dialog,
      #storage-dialog {
        align-items: flex-end;
        padding: 0.5rem;
        padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
      }

      #admin-dialog > div,
      #delete-dialog > div,
      #folder-dialog > div,
      #storage-dialog > div {
        max-width: none;
        border-radius: 1.25rem;
      }

      #admin-dialog button,
      #delete-dialog button,
      #folder-dialog button,
      #storage-dialog button {
        min-height: 2.75rem;
      }

      #admin-dialog input,
      #folder-dialog input,
      #storage-dialog input,
      #storage-dialog select {
        min-height: 2.75rem;
        font-size: 1rem;
      }

      #upload-panel,
      #download-panel {
        right: 0.5rem;
        bottom: max(0.5rem, env(safe-area-inset-bottom));
        left: 0.5rem;
        max-height: 55dvh;
        border-radius: 1.25rem;
      }

      #toast-container {
        top: max(0.5rem, env(safe-area-inset-top));
        right: 0.5rem;
        left: 0.5rem;
      }
    }

    html[data-theme="light"] body {
      color: #1d1d1f;
      background-color: #e5e5ea !important;
      background-image:
        radial-gradient(ellipse at top, rgba(255, 255, 255, 0.95), rgba(229, 229, 234, 0.85) 60%, #d1d1d6) !important;
    }

    html[data-theme="light"] ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    html[data-theme="light"] ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.35);
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    html[data-theme="light"] .bg-slate-900\/60 {
      background-color: rgba(255, 255, 255, 0.72) !important;
    }

    html[data-theme="light"] .bg-slate-900\/85,
    html[data-theme="light"] .bg-slate-900\/90 {
      background-color: rgba(255, 255, 255, 0.88) !important;
    }

    html[data-theme="light"] .bg-slate-950\/40 {
      background-color: rgba(255, 255, 255, 0.5) !important;
    }

    html[data-theme="light"] .bg-slate-950\/70,
    html[data-theme="light"] .bg-slate-950\/80 {
      background-color: rgba(0, 0, 0, 0.25) !important;
    }

    html[data-theme="light"] .bg-slate-800\/80 {
      background-color: rgba(255, 255, 255, 0.9) !important;
    }

    html[data-theme="light"] .hover\:bg-slate-700\/80:hover {
      background-color: rgba(0, 0, 0, 0.05) !important;
    }

    html[data-theme="light"] .bg-black\/15 {
      background-color: rgba(235, 235, 240, 0.6) !important;
    }

    html[data-theme="light"] .bg-black\/20,
    html[data-theme="light"] .bg-black\/30,
    html[data-theme="light"] .bg-black\/40 {
      background-color: rgba(0, 0, 0, 0.06) !important;
    }

    html[data-theme="light"] .focus\:bg-black\/40:focus,
    html[data-theme="light"] .focus\:bg-black\/60:focus {
      background-color: rgba(255, 255, 255, 0.95) !important;
    }

    html[data-theme="light"] .bg-white\/5 {
      background-color: rgba(0, 0, 0, 0.03) !important;
    }

    html[data-theme="light"] .bg-white\/10 {
      background-color: rgba(0, 0, 0, 0.06) !important;
    }

    html[data-theme="light"] .bg-white\/20 {
      background-color: rgba(0, 122, 255, 0.15) !important;
    }

    html[data-theme="light"] .hover\:bg-white\/5:hover,
    html[data-theme="light"] .hover\:bg-white\/10:hover {
      background-color: rgba(0, 0, 0, 0.05) !important;
    }

    html[data-theme="light"] .border-white\/5,
    html[data-theme="light"] .border-white\/10,
    html[data-theme="light"] .border-white\/15 {
      border-color: rgba(0, 0, 0, 0.1) !important;
    }

    html[data-theme="light"] .ring-white\/10 {
      --tw-ring-color: rgba(0, 0, 0, 0.08) !important;
    }

    html[data-theme="light"] .text-slate-100 {
      color: #1d1d1f !important;
    }

    html[data-theme="light"] .text-slate-200 {
      color: #2c2c2e !important;
    }

    html[data-theme="light"] .text-slate-300 {
      color: #3a3a3c !important;
    }

    html[data-theme="light"] .text-slate-400 {
      color: #636366 !important;
    }

    html[data-theme="light"] .text-slate-500,
    html[data-theme="light"] .text-slate-500\/80 {
      color: #8e8e93 !important;
    }

    html[data-theme="light"] .text-slate-600 {
      color: #aeaeb2 !important;
    }

    html[data-theme="light"] .placeholder-slate-500::placeholder {
      color: #8e8e93 !important;
    }

    html[data-theme="light"] .hover\:text-slate-100:hover,
    html[data-theme="light"] .hover\:text-slate-200:hover,
    html[data-theme="light"] .hover\:text-white:hover {
      color: #000000 !important;
    }

    html[data-theme="light"] #btn-grid.bg-white\/20,
    html[data-theme="light"] #btn-list.bg-white\/20 {
      color: #fff !important;
      background-color: #007aff !important;
    }

    html[data-theme="light"] #delete-dialog .text-white,
    html[data-theme="light"] #folder-dialog .text-white,
    html[data-theme="light"] #admin-dialog .text-white,
    html[data-theme="light"] #image-preview-dialog .text-white,
    html[data-theme="light"] #storage-dialog .text-white,
    html[data-theme="light"] #upload-panel .text-white,
    html[data-theme="light"] #download-panel .text-white,
    html[data-theme="light"] #drop-overlay .text-white {
      color: #1d1d1f !important;
    }

    html[data-theme="light"] #btn-delete-confirm.text-white,
    html[data-theme="light"] #btn-folder-confirm.text-white,
    html[data-theme="light"] #btn-admin-confirm.text-white,
    html[data-theme="light"] #btn-storage-confirm.text-white,
    html[data-theme="light"] #upload-total-progress,
    html[data-theme="light"] .bg-blue-600.text-white,
    html[data-theme="light"] .bg-blue-600\/90.text-white,
    html[data-theme="light"] .hover\:bg-blue-600:hover,
    html[data-theme="light"] .hover\:bg-rose-600:hover {
      color: #fff !important;
    }

    html[data-theme="light"] #context-menu,
    html[data-theme="light"] #upload-panel,
    html[data-theme="light"] #download-panel,
    html[data-theme="light"] #delete-dialog > div,
    html[data-theme="light"] #folder-dialog > div,
    html[data-theme="light"] #admin-dialog > div,
    html[data-theme="light"] #image-preview-dialog > div,
    html[data-theme="light"] #storage-dialog > div {
      background-color: rgba(255, 255, 255, 0.92) !important;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.2) !important;
    }

    html[data-theme="light"] #storage-name-input,
    html[data-theme="light"] #storage-access-select {
      color: #1d1d1f !important;
      background-color: rgba(0, 0, 0, 0.05) !important;
    }

    @media (prefers-reduced-motion: reduce) {
      body,
      body > div,
      #content-area,
      #upload-panel,
      #download-panel,
      #context-menu,
      #delete-dialog > div,
      #folder-dialog > div,
      #admin-dialog > div,
      #image-preview-dialog > div,
      #storage-dialog > div,
      input,
      select {
        transition: none;
      }
    }

  </style>
</head>

<body
  class="flex h-screen w-full items-center justify-center bg-slate-950 p-3 sm:p-6 font-sans text-slate-200 select-none antialiased bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

  <!-- Finder 窗口容器 -->
  <div id="app-window"
    class="flex h-[92vh] w-full max-w-6xl flex-col overflow-hidden rounded-2xl border border-white/10 bg-slate-900/60 backdrop-blur-3xl shadow-[0_30px_70px_-15px_rgba(0,0,0,0.8)] ring-1 ring-white/10">

    <!-- 顶栏 / 工具栏 -->
    <div id="app-toolbar"
      class="flex h-13 items-center justify-between border-b border-white/10 bg-white/5 px-4 py-2.5 backdrop-blur-xl">
      <!-- 窗口红黄绿控制按钮 -->
      <div id="window-actions" class="flex items-center gap-2 w-32 group pl-1">
        <button id="btn-delete" title="将所选项目移到废纸篓" aria-label="删除所选项目"
          class="relative flex h-3 w-3 items-center justify-center rounded-full bg-[#FF5F56] border border-[#E0443E] shadow-sm hover:brightness-105 active:brightness-90 disabled:cursor-default disabled:opacity-30 transition-all">
          <span class="opacity-0 group-hover:opacity-100 text-[8px] font-black text-[#4C0000] leading-none">✕</span>
        </button>
        <button id="btn-create-folder" title="新建文件夹" aria-label="新建文件夹"
          class="relative flex h-3 w-3 items-center justify-center rounded-full bg-[#FFBD2E] border border-[#DEA123] shadow-sm hover:brightness-105 active:brightness-90 transition-all disabled:cursor-default disabled:opacity-30">
          <span class="opacity-0 group-hover:opacity-100 text-[8px] font-black text-[#5C4000] leading-none">−</span>
        </button>
        <button id="btn-upload" title="上传文件" aria-label="上传文件"
          class="relative flex h-3 w-3 items-center justify-center rounded-full bg-[#27C93F] border border-[#1AAB29] shadow-sm hover:brightness-105 active:brightness-90 transition-all disabled:cursor-default disabled:opacity-30">
          <span class="opacity-0 group-hover:opacity-100 text-[8px] font-black text-[#003D00] leading-none">＋</span>
        </button>
      </div>

      <!-- 视图切换 & 路径提示 -->
      <div id="navigation-toolbar" class="flex items-center gap-4">
        <div class="flex items-center gap-0.5 rounded-lg bg-black/20 p-0.5 border border-white/5 shadow-inner">
          <button id="btn-back" title="后退"
            class="rounded-md p-1.5 text-slate-400 hover:bg-white/10 hover:text-slate-100 disabled:opacity-30 transition-all">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">

    <div data-menu-section="tags" class="px-3 py-2">
      <div class="mb-2 text-[10px] font-bold uppercase tracking-wider text-slate-500">标签</div>
      <div id="context-tag-options" class="grid grid-cols-8 gap-2"></div>
    </div>
    <div class="my-1 h-px bg-white/10"></div>
    <button data-menu-action="create-folder"
      class="flex w-full items-center justify-between rounded-lg px-3 py-2 text-left hover:bg-blue-600 hover:text-white disabled:cursor-default disabled:opacity-40 transition-colors">
      <span>新建文件夹</span><span class="text-[10px] opacity-60">⇧⌘N</span>
    </button>
    <button data-menu-action="upload"
      class="flex w-full items-center justify-between rounded-lg px-3 py-2 text-left hover:bg-blue-600 hover:text-white disabled:cursor-default disabled:opacity-40 transition-colors">
      <span>上传文件…</span><span class="text-[10px] opacity-60">⌘U</span>
    </button>
    <div data-menu-section="selection" class="my-1 h-px bg-white/10"></div>
    <button data-menu-action="delete"
      class="flex w-full items-center justify-between rounded-lg px-3 py-2 text-left text-rose-400 hover:bg-rose-600 hover:text-white disabled:cursor-default disabled:opacity-40 transition-colors">
      <span data-menu-label="delete">移到废纸篓</span><span class="text-[10px] opacity-60">⌫</span>
    </button>
  </div>

  <!-- 拖拽上传提示 -->
  <div id="drop-overlay"
    class="pointer-events-none fixed inset-0 z-40 hidden items-center justify-center bg-slate-950/80 backdrop-blur-md">
    <div
      class="mx-4 rounded-3xl border-2 border-dashed border-blue-400/80 bg-slate-900/90 px-8 py-14 text-center shadow-2xl ring-1 ring-white/10 sm:px-20">
      <div class="mb-4 text-6xl animate-bounce">📥</div>
      <div class="text-lg font-semibold text-white">拖放到此文件夹</div>
      <div class="mt-1.5 text-xs text-slate-400">松开鼠标即可上传到当前目录</div>
    </div>
  </div>

  <script>
    const API_BASE = '/api/files';
    const PAGE_SIZE = 50;
    const mobileViewQuery = window.matchMedia('(max-width: 639px)');
    let currentView = mobileViewQuery.matches ? 'list' : 'grid';
    let selectedFileId = null;
    let selectedFileIds = new Set();
    let selectionAnchorId = null;
    let searchQuery = '';
    let searchTimer = null;
    let searchOriginTag = null;
    let files = [];
    let nextOffset = 0;
    let totalItems = 0;
    let hasMore = false;
    let sortBy = 'name';
    let sortOrder = 'asc';
    let viewRequestId = 0;
    let clipboardEntry = null;
    let uploadInput = null;
    let dragDepth = 0;
    let uploadQueue = [];
    let uploadRunning = false;
    let uploadSequence = 0;
    let downloadQueue = [];
    let downloadRunning = false;
    let downloadSequence = 0;
    let downloadDirectory = null;
    let currentDownloadController = null;
    let downloadRenderScheduled = false;
    let marqueeSelection = null;
    let marqueeRenderScheduled = false;
    let previewFileId = null;
    let adminToken = readAdminToken();
    let adminRequired = true;
    let storageLocations = [];
    let currentStorageLocationId = null;
    let editingStorageLocationId = null;
    let adminAuthenticating = false;
    let creatingFolder = false;
    let deletingFile = false;
    let pendingDeleteItems = [];
    let availableTags = [];
    let activeTag = null;
    let navigationHistory = [{ id: null, name: '米饭云盘' }];
    let historyIndex = 0;
    let loading = false;
    let currentTheme = document.documentElement.dataset.theme === 'light'
      ? 'light'
      : 'dark';

    const fileIconPalettes = {
      code: ['#38bdf8', 'rgba(14, 165, 233, 0.18)'],
      image: ['#22c55e', 'rgba(34, 197, 94, 0.18)'],
      video: ['#a855f7', 'rgba(168, 85, 247, 0.18)'],
      audio: ['#c084fc', 'rgba(192, 132, 252, 0.18)'],
      archive: ['#f59e0b', 'rgba(245, 158, 11, 0.18)'],
      pdf: ['#f43f5e', 'rgba(244, 63, 94, 0.18)'],
      document: ['#3b82f6', 'rgba(59, 130, 246, 0.18)'],
      spreadsheet: ['#10b981', 'rgba(16, 185, 129, 0.18)'],
      presentation: ['#f97316', 'rgba(249, 115, 22, 0.18)'],
      text: ['#94a3b8', 'rgba(148, 163, 184, 0.16)'],
      database: ['#6366f1', 'rgba(99, 102, 241, 0.18)'],
      font: ['#ec4899', 'rgba(236, 72, 153, 0.18)'],
      ebook: ['#14b8a6', 'rgba(20, 184, 166, 0.18)'],
      executable: ['#64748b', 'rgba(100, 116, 139, 0.2)'],
      disk: ['#78716c', 'rgba(120, 113, 108, 0.2)'],
      config: ['#eab308', 'rgba(234, 179, 8, 0.17)'],
      design: ['#f472b6', 'rgba(244, 114, 182, 0.18)'],
      file: ['#94a3b8', 'rgba(148, 163, 184, 0.16)']
    };

    function currentFolder() {
      return navigationHistory[historyIndex];
    }

    function canWriteCurrentStorage() {
      if (!adminRequired || adminToken) return true;
      return storageLocations.find(
        item => item.id === currentStorageLocationId
      )?.anonymousAccess === 'write';
    }

    function canEditCurrentTags() {
      return canWriteCurrentStorage();
    }

    async function init() {
      bindActions();
      applyTheme(currentTheme);
      switchView(currentView);
      await loadAdminStatus();
      await loadStorageLocations();
      updateAdminUi();
      renderSidebar();
      renderBreadcrumbs();
      updateNavigationButtons();
      await loadTags();
      await loadFiles();
    }

    function bindActions() {
      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.multiple = true;
      fileInput.hidden = true;
      fileInput.addEventListener('change', () => uploadFiles(fileInput.files));
      document.body.appendChild(fileInput);
      uploadInput = fileInput;

      document.getElementById('btn-upload').addEventListener('click', openUploadPicker);
      document.getElementById('btn-create-folder').addEventListener('click', createFolder);
      document.getElementById('btn-delete').addEventListener('click', deleteSelected);
      document.getElementById('btn-back').addEventListener('click', navigateBack);
      document.getElementById('btn-forward').addEventListener('click', navigateForward);
      document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
      document.getElementById('btn-admin-auth').addEventListener(
        'click',
        handleAdminButton
      );
      document.getElementById('btn-manage-storage').addEventListener(
        'click',
        () => openStorageDialog()
      );
      document.getElementById('btn-storage-cancel').addEventListener(
        'click',
        closeStorageDialog
      );
      document.getElementById('btn-storage-confirm').addEventListener(
        'click',
        saveStorageLocation
      );
      document.getElementById('btn-storage-delete').addEventListener(
        'click',
        deleteStorageLocation
      );
      document.getElementById('storage-name-input').addEventListener(
        'keydown',
        event => {
          if (event.key === 'Enter') saveStorageLocation();
          if (event.key === 'Escape') closeStorageDialog();
        }
      );
      document.getElementById('storage-dialog').addEventListener(
        'click',
        event => {
          if (event.target === event.currentTarget) closeStorageDialog();
        }
      );
      document.getElementById('btn-admin-cancel').addEventListener(
        'click',
        closeAdminDialog
      );
      document.getElementById('btn-admin-confirm').addEventListener(
        'click',
        submitAdminDialog
      );
      document.getElementById('admin-token-input').addEventListener('keydown', event => {
        if (event.key === 'Enter') submitAdminDialog();
        if (event.key === 'Escape') closeAdminDialog();
      });
      document.getElementById('admin-dialog').addEventListener('click', event => {
        if (event.target === event.currentTarget) closeAdminDialog();
      });
      document.getElementById('btn-clear-uploads').addEventListener('click', clearFinishedUploads);
      document.getElementById('btn-download-selected').addEventListener('click', startSelectedDownloads);
      document.getElementById('btn-stop-downloads').addEventListener('click', stopDownloadQueue);
      document.getElementById('btn-clear-downloads').addEventListener('click', clearFinishedDownloads);
      document.getElementById('btn-image-preview-close').addEventListener('click', closeImagePreview);
      document.getElementById('btn-image-preview-download').addEventListener(
        'click',
        downloadPreviewImage
      );
      document.getElementById('image-preview-content').addEventListener(
        'load',
        handleImagePreviewLoaded
      );
      document.getElementById('image-preview-content').addEventListener(
        'error',
        handleImagePreviewError
      );
      document.getElementById('image-preview-dialog').addEventListener('click', event => {
        if (event.target === event.currentTarget) closeImagePreview();
      });
      document.getElementById('btn-folder-cancel').addEventListener('click', closeFolderDialog);
      document.getElementById('btn-folder-confirm').addEventListener('click', submitFolderDialog);
      document.getElementById('btn-delete-cancel').addEventListener('click', closeDeleteDialog);
      document.getElementById('btn-delete-confirm').addEventListener('click', submitDeleteDialog);
      document.getElementById('folder-name-input').addEventListener('keydown', event => {
        if (event.key === 'Enter') submitFolderDialog();
        if (event.key === 'Escape') closeFolderDialog();
      });
      document.getElementById('folder-dialog').addEventListener('click', event => {
        if (event.target === event.currentTarget) closeFolderDialog();
      });
      document.getElementById('delete-dialog').addEventListener('click', event => {
        if (event.target === event.currentTarget) closeDeleteDialog();
      });
      document.getElementById('delete-dialog').addEventListener('keydown', event => {
        if (event.key === 'Enter') submitDeleteDialog();
        if (event.key === 'Escape') closeDeleteDialog();
      });
      document.getElementById('content-area').addEventListener('contextmenu', event => {
        showContextMenu(event, null);
      });
      document.getElementById('content-area').addEventListener(
        'pointerdown',
        beginMarqueeSelection
      );
      document.getElementById('content-area').addEventListener('scroll', handleInfiniteScroll);
      document.querySelectorAll('[data-menu-action]').forEach(button => {
        button.addEventListener('click', () => handleMenuAction(button.dataset.menuAction));
      });
      document.addEventListener('click', hideContextMenu);
      window.addEventListener('resize', hideContextMenu);
      window.addEventListener('scroll', hideContextMenu, true);
      mobileViewQuery.addEventListener('change', handleResponsiveViewChange);
      bindDropUpload();
      document.addEventListener('keydown', event => {
        const editing = ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName);
        if (event.key === 'Escape') {
          if (previewFileId) closeImagePreview();
          else hideContextMenu();
        }
        if (previewFileId) return;
        if (editing) return;
        if (event.key === 'Delete' || event.key === 'Backspace' && event.metaKey) {
          event.preventDefault();
          deleteSelected();
        }
        if (event.key === 'Enter' && selectedFileId) {
          if (selectedFileIds.size > 1) {
            startSelectedDownloads();
          } else {
            openFile(selectedFileId);
          }
        }
        if (event.metaKey && event.shiftKey && event.key.toLowerCase() === 'c') {
          event.preventDefault();
          copyDownloadLink();
        } else if (event.metaKey && event.key.toLowerCase() === 'c') {
          event.preventDefault();
          copySelected();
        }
        if (event.metaKey && event.key.toLowerCase() === 'v') {
          event.preventDefault();
          pasteClipboard();
        }
        if (event.metaKey && event.shiftKey && event.key.toLowerCase() === 'n') {
          event.preventDefault();
          createFolder();
        }
        if (event.metaKey && event.key.toLowerCase() === 'u') {
          event.preventDefault();
          openUploadPicker();
        }
      });
    }

    function applyTheme(theme, persist = false) {
      currentTheme = theme === 'light' ? 'light' : 'dark';
      document.documentElement.dataset.theme = currentTheme;

      const isLight = currentTheme === 'light';
      const toggle = document.getElementById('theme-toggle');
      document.getElementById('theme-icon').innerText = isLight ? '☾' : '☀︎';
      document.getElementById('theme-label').innerText = isLight ? '暗色' : '亮色';
      toggle.title = isLight ? '切换到暗色主题' : '切换到亮色主题';
      toggle.setAttribute('aria-label', toggle.title);
      toggle.setAttribute('aria-pressed', String(isLight));

      if (persist) {
        try {
          localStorage.setItem('tgfs-theme', currentTheme);
        } catch {
          // 本地存储不可用不影响当前会话内的主题切换。
        }
      }
    }

    function toggleTheme() {
      applyTheme(currentTheme === 'dark' ? 'light' : 'dark', true);
    }

    function readAdminToken() {
      try {
        return sessionStorage.getItem('tgfs-admin-token') || '';
      } catch {
        return '';
      }
    }

    async function loadAdminStatus() {
      try {
        const response = await fetch('/api/admin/status');
        const body = await response.json();
        if (!response.ok || typeof body?.data?.required !== 'boolean') {
          throw new Error('无法读取管理员鉴权状态');
        }
        adminRequired = body.data.required;
      } catch {
        // 状态未知时保持鉴权开启，避免错误放开敏感操作入口。
        adminRequired = true;
      }
    }

    async function loadStorageLocations() {
      try {
        const headers = adminToken
          ? { authorization: `Bearer ${adminToken}` }
          : {};
        const response = await fetch('/api/storage-locations', { headers });
        const body = await response.json();
        if (!response.ok) throw new Error(body?.error?.message || '加载失败');
        storageLocations = body.data || [];
        if (!storageLocations.some(item => item.id === currentStorageLocationId)) {
          currentStorageLocationId = storageLocations[0]?.id || null;
          const location = storageLocations[0];
          navigationHistory = [{
            id: null,
            name: location?.name || '无存储位置'
          }];
          historyIndex = 0;
        } else {
          const current = storageLocations.find(
            item => item.id === currentStorageLocationId
          );
          if (navigationHistory[0] && current) {
            navigationHistory[0].name = current.name;
          }
        }
      } catch (error) {
        storageLocations = [];
        currentStorageLocationId = null;
        showToast(`存储位置加载失败：${error.message}`, 'error');
      }
    }

    function handleAdminButton() {
      if (adminToken) {
        clearAdminSession();
        showToast('已退出管理员模式', 'info');
        return;
      }
      openAdminDialog();
    }

    function openAdminDialog() {
      const dialog = document.getElementById('admin-dialog');
      const input = document.getElementById('admin-token-input');
      const error = document.getElementById('admin-dialog-error');
      input.value = '';
      error.innerText = '';
      error.classList.add('hidden');
      dialog.classList.remove('hidden');
      dialog.classList.add('flex');
      requestAnimationFrame(() => input.focus());
    }

    function closeAdminDialog() {
      if (adminAuthenticating) return;
      const dialog = document.getElementById('admin-dialog');
      dialog.classList.add('hidden');
      dialog.classList.remove('flex');
    }

    async function submitAdminDialog() {
      if (adminAuthenticating) return;
      const input = document.getElementById('admin-token-input');
      const error = document.getElementById('admin-dialog-error');
      const confirm = document.getElementById('btn-admin-confirm');
      const cancel = document.getElementById('btn-admin-cancel');
      const token = input.value.trim();
      if (!token) {
        error.innerText = '请输入管理员 Token';
        error.classList.remove('hidden');
        return;
      }

      adminAuthenticating = true;
      confirm.disabled = true;
      cancel.disabled = true;
      confirm.innerText = '正在验证…';
      error.classList.add('hidden');
      try {
        const response = await fetch('/api/admin/verify', {
          method: 'POST',
          headers: { authorization: `Bearer ${token}` }
        });
        const body = await response.json();
        if (!response.ok || !body?.data?.authenticated) {
          throw new Error(body?.error?.message || '管理员 Token 无效');
        }

        adminToken = token;
        try {
          sessionStorage.setItem('tgfs-admin-token', token);
        } catch {
          // sessionStorage 不可用时仅在当前页面内保留 Token。
        }
        adminAuthenticating = false;
        closeAdminDialog();
        updateAdminUi();
        await loadStorageLocations();
        await loadTags();
        renderSidebar();
        await refreshContent();
        showToast('已进入管理员模式', 'success');
      } catch (requestError) {
        error.innerText = requestError.message;
        error.classList.remove('hidden');
      } finally {
        adminAuthenticating = false;
        confirm.disabled = false;
        cancel.disabled = false;
        confirm.innerText = '登录';
      }
    }

    function clearAdminSession(openLogin = false) {
      adminToken = '';
      try {
        sessionStorage.removeItem('tgfs-admin-token');
      } catch {
        // 忽略不可用的会话存储。
      }
      updateAdminUi();
      renderSidebar();
      renderContent();
      void loadStorageLocations().then(() => {
        void loadTags().then(() => {
          renderSidebar();
          renderBreadcrumbs();
          void loadFiles();
        });
      });
      if (openLogin) openAdminDialog();
    }

    function updateAdminUi() {
      const button = document.getElementById('btn-admin-auth');
      document.getElementById('btn-manage-storage').classList.toggle(
        'hidden',
        adminRequired && !adminToken
      );
      button.classList.toggle('hidden', !adminRequired);
      if (!adminRequired) return;
      button.innerText = adminToken ? '退出管理员' : '管理员登录';
      button.title = adminToken ? '退出管理员模式' : '管理员登录';
      button.classList.toggle('text-emerald-300', Boolean(adminToken));
    }

    function requireAdmin() {
      if (!adminRequired || adminToken) return true;
      showToast('此操作需要管理员登录', 'info');
      openAdminDialog();
      return false;
    }

    function openUploadPicker() {
      if (!canWriteCurrentStorage()) {
        showToast('该存储位置不允许匿名写入', 'info');
        return;
      }
      if (isVirtualView()) {
        showToast('请先进入一个文件夹再上传', 'info');
        return;
      }
      uploadInput?.click();
    }

    function bindDropUpload() {
      const overlay = document.getElementById('drop-overlay');
      document.addEventListener('dragenter', event => {
        if (!hasDraggedFiles(event)) return;
        event.preventDefault();
        if (isVirtualView() || !canWriteCurrentStorage()) return;
        dragDepth++;
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
      });
      document.addEventListener('dragover', event => {
        if (!hasDraggedFiles(event)) return;
        event.preventDefault();
        if (isVirtualView() || !canWriteCurrentStorage()) {
          event.dataTransfer.dropEffect = 'none';
          return;
        }
        event.dataTransfer.dropEffect = 'copy';
      });
      document.addEventListener('dragleave', event => {
        if (!hasDraggedFiles(event)) return;
        event.preventDefault();
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) hideDropOverlay();
      });
      document.addEventListener('drop', event => {
        if (!hasDraggedFiles(event)) return;
        event.preventDefault();
        dragDepth = 0;
        hideDropOverlay();
        if (!canWriteCurrentStorage()) {
          showToast('该存储位置不允许匿名写入', 'info');
          return;
        }
        if (isVirtualView()) {
          showToast('请先进入一个文件夹再上传', 'info');
          return;
        }
        uploadFiles(event.dataTransfer.files);
      });
    }

    function hasDraggedFiles(event) {
      return [...(event.dataTransfer?.types || [])].includes('Files');
    }

    function hideDropOverlay() {
      const overlay = document.getElementById('drop-overlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }

    async function apiRequest(path, options = {}) {
      const requestOptions = { ...options };
      const headers = new Headers(options.headers || {});
      if (adminToken) {
        headers.set('authorization', `Bearer ${adminToken}`);
      }
      requestOptions.headers = headers;
      const requestUrl = path.startsWith('/api/')
        ? path
        : `${API_BASE}${path}`;
      const response = await fetch(requestUrl, requestOptions);
      const text = await response.text();
      const body = text ? JSON.parse(text) : null;

      if (!response.ok) {
        if (response.status === 401) {
          clearAdminSession(true);
        }
        throw new Error(
          body?.error?.message ||
          body?.message ||
          `请求失败（HTTP ${response.status}）`
        );
      }
      return body;
    }

    async function loadTags() {
      if (!currentStorageLocationId) {
        availableTags = [];
        renderSidebar();
        return;
      }
      try {
        const headers = adminToken
          ? { authorization: `Bearer ${adminToken}` }
          : {};
        const response = await fetch('/api/tags', { headers });
        const body = await response.json();
        if (!response.ok) {
          throw new Error(body?.error?.message || `请求失败（HTTP ${response.status}）`);
        }
        availableTags = body.data;
        if (
          activeTag &&
          !availableTags.some(tag => tag.slug === activeTag)
        ) {
          activeTag = null;
        }
        renderSidebar();
      } catch (error) {
        availableTags = [];
        renderSidebar();
        showToast(`标签加载失败：${error.message}`, 'error');
      }
    }

    function isVirtualView() {
      return Boolean(activeTag || searchQuery);
    }

    function resetPagination() {
      files = [];
      nextOffset = 0;
      totalItems = 0;
      hasMore = false;
      document.getElementById('content-area').scrollTop = 0;
    }

    function clearSearchState() {
      viewRequestId++;
      loading = false;
      searchQuery = '';
      searchOriginTag = null;
      if (searchTimer) {
        clearTimeout(searchTimer);
        searchTimer = null;
      }
      document.getElementById('search-input').value = '';
    }

    function createPageParams(offset) {
      return new URLSearchParams({
        storageLocationId: currentStorageLocationId || '',
        offset: String(offset),
        limit: String(PAGE_SIZE),
        sortBy,
        sortOrder
      });
    }

    function applyPageResponse(response, append) {
      const pageItems = response.data.map(normalizeFile);
      files = append ? [...files, ...pageItems] : pageItems;
      nextOffset = response.pagination.offset + pageItems.length;
      totalItems = response.pagination.total;
      hasMore = response.pagination.hasMore;
    }

    function setCurrentFolderName(name) {
      const element = document.getElementById('current-folder-name');
      element.innerText = name;
      element.title = name;
    }

    async function loadFiles(append = false) {
      if (!currentStorageLocationId) {
        files = [];
        totalItems = 0;
        hasMore = false;
        setCurrentFolderName('无存储位置');
        renderSidebar();
        renderContent();
        return;
      }
      if (append && (loading || !hasMore)) return;
      if (!append) {
        activeTag = null;
        clearSearchState();
        resetPagination();
      }

      const requestId = ++viewRequestId;
      loading = true;
      clearSelection();
      setStatus(append ? '正在加载更多…' : '正在加载…');
      if (!append) {
        renderLoadingState();
        renderSidebar();
        renderBreadcrumbs();
      }

      try {
        const folder = currentFolder();
        const params = createPageParams(append ? nextOffset : 0);
        if (folder.id !== null) params.set('parentId', folder.id);
        const response = await apiRequest(`?${params.toString()}`);
        if (requestId !== viewRequestId) return;
        applyPageResponse(response, append);
        setCurrentFolderName(folder.name);
        renderSidebar();
        renderBreadcrumbs();
        renderContent();
      } catch (error) {
        if (requestId !== viewRequestId) return;
        if (!append) {
          resetPagination();
          renderErrorState(error.message);
        }
        setStatus(error.message);
        showToast(`加载失败：${error.message}`, 'error');
      } finally {
        if (requestId === viewRequestId) {
          loading = false;
          updateNavigationButtons();
        }
      }
    }

    async function refreshContent() {
      if (searchQuery) {
        await performGlobalSearch(searchQuery);
      } else if (activeTag) {
        await selectTag(activeTag);
      } else {
        await loadFiles();
      }
    }

    function normalizeFile(file) {
      return {
        ...file,
        tags: Array.isArray(file.tags) ? file.tags : [],
        hasThumbnail: Boolean(file.hasThumbnail),
        iconType: resolveIconType(file),
        displaySize: file.type === 'folder' ? '--' : formatBytes(file.size),
        displayDate: formatDate(file.updatedAt),
        displayType: formatFileType(file)
      };
    }

    function formatFileType(file) {
      if (file.type === 'folder') return '文件夹';

      const extension = getFileExtension(file);
      if (extension) return extension.toUpperCase();

      const mimeType = String(file.mimeType || '').toLowerCase();
      if (mimeType === 'application/pdf') return 'PDF';
      if (mimeType.startsWith('image/')) return '图片';
      if (mimeType.startsWith('video/')) return '视频';
      if (mimeType.startsWith('audio/')) return '音频';
      if (mimeType.startsWith('text/')) return '文本';
      return '文件';
    }

    function getFileExtension(file) {
      const explicitExtension = String(file.extension || '')
        .trim()
        .replace(/^\.+/, '');
      const filenameExtension =
        String(file.name || '').match(/\.([^.]+)$/)?.[1] || '';
      return (explicitExtension || filenameExtension).toLowerCase();
    }

    function resolveIconType(file) {
      if (file.type === 'folder') return 'folder';
      const extension = getFileExtension(file);
      const mimeType = String(file.mimeType || '').toLowerCase();
      if ([
        'jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'heic', 'heif',
        'avif', 'bmp', 'tif', 'tiff', 'ico', 'raw', 'cr2', 'nef'
      ].includes(extension) || mimeType.startsWith('image/')) return 'image';
      if ([
        'mp4', 'mov', 'mkv', 'avi', 'webm', 'm4v', 'flv', 'wmv',
        'mpeg', 'mpg', '3gp'
      ].includes(extension) || mimeType.startsWith('video/')) return 'video';
      if ([
        'mp3', 'wav', 'flac', 'm4a', 'aac', 'ogg', 'oga', 'opus',
        'wma', 'aiff', 'mid', 'midi'
      ].includes(extension) || mimeType.startsWith('audio/')) return 'audio';
      if ([
        'zip', 'rar', '7z', 'tar', 'gz', 'tgz', 'bz2', 'xz', 'zst',
        'cab'
      ].includes(extension)) return 'archive';
      if (extension === 'pdf') return 'pdf';
      if ([
        'doc', 'docx', 'odt', 'rtf', 'pages'
      ].includes(extension)) return 'document';
      if ([
        'xls', 'xlsx', 'xlsm', 'csv', 'tsv', 'ods', 'numbers'
      ].includes(extension)) return 'spreadsheet';
      if ([
        'ppt', 'pptx', 'odp', 'key'
      ].includes(extension)) return 'presentation';
      if ([
        'js', 'mjs', 'cjs', 'ts', 'tsx', 'jsx', 'vue', 'svelte',
        'html', 'htm', 'css', 'scss', 'sass', 'less', 'rs', 'go',
        'py', 'rb', 'php', 'java', 'kt', 'swift', 'c', 'h', 'cpp',
        'hpp', 'cs', 'sh', 'bash', 'zsh', 'fish'
      ].includes(extension)) return 'code';
      if ([
        'txt', 'md', 'markdown', 'log'
      ].includes(extension) || mimeType.startsWith('text/')) return 'text';
      if ([
        'db', 'sqlite', 'sqlite3', 'sql', 'parquet', 'avro'
      ].includes(extension)) return 'database';
      if ([
        'json', 'json5', 'xml', 'yaml', 'yml', 'toml', 'ini',
        'conf', 'config', 'env', 'properties', 'lock'
      ].includes(extension)) return 'config';
      if ([
        'ttf', 'otf', 'woff', 'woff2', 'eot'
      ].includes(extension)) return 'font';
      if ([
        'epub', 'mobi', 'azw', 'azw3', 'fb2'
      ].includes(extension)) return 'ebook';
      if ([
        'exe', 'msi', 'apk', 'aab', 'dmg', 'pkg', 'deb', 'rpm',
        'appimage'
      ].includes(extension)) return 'executable';
      if ([
        'iso', 'img', 'vhd', 'vhdx', 'vmdk'
      ].includes(extension)) return 'disk';
      if ([
        'fig', 'sketch', 'psd', 'psb', 'ai', 'xd', 'eps'
      ].includes(extension)) return 'design';
      return 'file';
    }

    function renderSidebar() {
      document.getElementById('sidebar-list').innerHTML =
        storageLocations.map(location => {
          const active =
            location.id === currentStorageLocationId &&
            !activeTag &&
            !searchQuery;
          const cls = active
            ? 'bg-blue-600/90 text-white font-medium shadow-sm'
            : 'text-slate-400 hover:bg-white/5 hover:text-slate-200';

          return `
            <li
              onclick="navigateToStorageLocation('${escapeHtml(location.id)}')"
              oncontextmenu="${canManage
                ? `event.preventDefault();event.stopPropagation();openStorageDialog('${escapeHtml(location.id)}')`

              title="${canManage ? '右键管理存储位置' : escapeHtml(location.name)}"
              class="flex cursor-pointer items-center gap-2.5 rounded-lg px-2.5 py-1.5 transition-all ${cls}">

        isVirtualView() || !canWriteCurrentStorage();

    function renderBreadcrumbs() {
      if (searchQuery) {
        document.getElementById('breadcrumb-path').innerHTML = `
          <button onclick="navigateToRoot()" class="max-w-32 truncate hover:text-white transition-colors">${escapeHtml(navigationHistory[0]?.name || '存储位置')}</button>
          <span class="shrink-0 text-slate-600">&gt;</span>
          <span class="max-w-56 truncate text-slate-200 font-medium" title="${escapeHtml(searchQuery)}">
            搜索“${escapeHtml(searchQuery)}”
          </span>
        `;
        return;
      }
      if (activeTag) {
        const tag = availableTags.find(item => item.slug === activeTag);
        document.getElementById('breadcrumb-path').innerHTML = `
          <button onclick="navigateToRoot()" class="max-w-32 truncate hover:text-white transition-colors">${escapeHtml(navigationHistory[0]?.name || '存储位置')}</button>
          <span class="shrink-0 text-slate-600">&gt;</span>

            ${escapeHtml(tag?.name || activeTag)}

      }

        const buttonClass = isCurrent

    async function selectTag(slug, append = false) {
      if (append && (loading || !hasMore)) return;
      const tag = availableTags.find(item => item.slug === slug);
      if (!tag) return;

      if (!append) {
        clearSearchState();
        activeTag = slug;
        resetPagination();
      }
      const requestId = ++viewRequestId;
      loading = true;
      clearSelection();
      setStatus(append ? '正在加载更多…' : `正在加载${tag.name}标签…`);
      if (!append) {
        renderLoadingState();
        renderSidebar();
        renderBreadcrumbs();
      }

      try {
        const params = createPageParams(append ? nextOffset : 0);
        const response = await apiRequest(
          `/by-tag/${encodeURIComponent(slug)}?${params.toString()}`
        );
        if (requestId !== viewRequestId) return;
        applyPageResponse(response, append);
        setCurrentFolderName(tag.name);
        renderSidebar();
        renderBreadcrumbs();
        renderContent();
      } catch (error) {
        if (requestId !== viewRequestId) return;
        if (!append) {
          resetPagination();
          renderErrorState(error.message);
        }
        setStatus(error.message);
        showToast(`标签筛选失败：${error.message}`, 'error');
      } finally {
        if (requestId === viewRequestId) {
          loading = false;
          updateNavigationButtons();
        }
      }
    }

    async function performGlobalSearch(query, append = false) {
      const normalized = query.trim();
      if (!normalized || append && (loading || !hasMore)) return;

      if (!append) {
        activeTag = null;
        searchQuery = normalized;
        resetPagination();
      }
      const requestId = ++viewRequestId;
      loading = true;
      clearSelection();
      setStatus(append ? '正在加载更多搜索结果…' : '正在全局搜索…');
      if (!append) {
        renderLoadingState();
        renderSidebar();
        renderBreadcrumbs();
      }

      try {
        const params = createPageParams(append ? nextOffset : 0);
        params.set('q', normalized);
        const response = await apiRequest(`/search?${params.toString()}`);
        if (
          requestId !== viewRequestId ||
          searchQuery !== normalized
        ) {
          return;
        }
        applyPageResponse(response, append);
        setCurrentFolderName('搜索');
        renderSidebar();
        renderBreadcrumbs();
        renderContent();
      } catch (error) {
        if (requestId !== viewRequestId) return;
        if (!append) {
          resetPagination();
          renderErrorState(error.message);
        }
        setStatus(error.message);
        showToast(`搜索失败：${error.message}`, 'error');
      } finally {
        if (requestId === viewRequestId) {
          loading = false;
          updateNavigationButtons();
        }
      }
    }

    function renderContent() {

      downloadButton.innerText = `下载所选文件（${selectedFiles.length}）`;

      setStatus(selectedFileIds.size

        : `已加载 ${filtered.length} / ${totalItems} 个项目，共 ${formatBytes(totalFileSize(filtered))}`
      );

      if (!filtered.length) {
        const searching = Boolean(searchQuery.trim());
        const tag = activeTag
          ? availableTags.find(item => item.slug === activeTag)
          : null;
        const icon = searching ? '🔍' : activeTag ? '🏷️' : '📂';
        const title = searching
          ? '没有搜索结果'
          : activeTag
            ? `没有${tag?.name || ''}标签的项目`
            : '此文件夹为空';
        const description = searching
          ? `没有找到包含“${escapeHtml(searchQuery.trim())}”的项目`
          : activeTag
            ? '在文件或文件夹的右键菜单中可以添加标签'
            : mobileViewQuery.matches

              <div>名称</div>
              <div>修改日期</div>
              <div>类型</div>
              <div class="text-right">大小</div>
            </div>
            ${filtered.map(file => {
          const isSelected = selectedFileIds.has(file.id);

          return `
                <div data-file-id="${escapeHtml(file.id)}" title="${escapeHtml(file.name)}" onclick="selectFile(this.dataset.fileId, event)" ondblclick="openFile(this.dataset.fileId)" oncontextmenu="showContextMenu(event, this.dataset.fileId)" class="file-list-columns items-center py-2 px-3 rounded-lg cursor-pointer transition-colors ${activeCls}">

    function renderFileVisual(file, compact = false) {

    function renderFileTypeIcon(file, compact = false) {
      const palette = fileIconPalettes[file.iconType] ||
        fileIconPalettes.file;
      const extension = getFileExtension(file);
      const fallbackLabels = {
        audio: 'AUD',
        code: 'CODE',
        config: 'CFG',
        database: 'DB',
        design: 'DSN',
        disk: 'DISK',
        document: 'DOC',
        ebook: 'BOOK',
        executable: 'APP',
        file: 'FILE',
        font: 'FONT',
        image: 'IMG',
        presentation: 'PPT',
        spreadsheet: 'XLS',
        text: 'TXT',
        video: 'VID'
      };
      const label = (extension || fallbackLabels[file.iconType] || 'FILE')
        .slice(0, 5)
        .toUpperCase();

        <span
          class="file-type-icon${compactClass}"
