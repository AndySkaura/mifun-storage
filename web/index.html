    function handleResponsiveViewChange(event) {
      if (event.matches) switchView('list');
    }

    function beginMarqueeSelection(event) {
      if (
        loading ||
        event.button !== 0 ||
        !event.isPrimary ||
        event.target.closest('[data-file-id], button, input, select, a')
      ) {
        return;
      }

      const content = document.getElementById('content-area');
      const bounds = content.getBoundingClientRect();
      const additive = event.metaKey || event.ctrlKey;
      const startX = clamp(event.clientX, bounds.left, bounds.right);
      const startY = clamp(event.clientY, bounds.top, bounds.bottom);

      marqueeSelection = {
        pointerId: event.pointerId,
        startX,
        startY,
        currentX: startX,
        currentY: startY,
        bounds,
        dragging: false,
        initialIds: additive ? new Set(selectedFileIds) : new Set(),
        initialSelectedFileId: additive ? selectedFileId : null,
        initialAnchorId: additive ? selectionAnchorId : null,
        captureTarget: content
      };

      try {
        content.setPointerCapture(event.pointerId);
      } catch {
        // 文档级监听仍可继续处理不支持指针捕获的环境。
      }
      if (!additive) clearSelection();
      hideContextMenu();
      renderContent();
      event.preventDefault();
      document.addEventListener('pointermove', updateMarqueeSelection);
      document.addEventListener('pointerup', finishMarqueeSelection);
      document.addEventListener('pointercancel', finishMarqueeSelection);
    }

    function updateMarqueeSelection(event) {
      const state = marqueeSelection;
      if (!state || event.pointerId !== state.pointerId) return;

      state.currentX = clamp(event.clientX, state.bounds.left, state.bounds.right);
      state.currentY = clamp(event.clientY, state.bounds.top, state.bounds.bottom);
      if (
        !state.dragging &&
        Math.hypot(
          state.currentX - state.startX,
          state.currentY - state.startY
        ) < 4
      ) {
        return;
      }

      state.dragging = true;
      renderMarqueeRectangle(state);
      scheduleMarqueeSelectionRender();
      event.preventDefault();
    }

    function finishMarqueeSelection(event) {
      const state = marqueeSelection;
      if (!state || event.pointerId !== state.pointerId) return;

      state.currentX = clamp(event.clientX, state.bounds.left, state.bounds.right);
      state.currentY = clamp(event.clientY, state.bounds.top, state.bounds.bottom);
      if (state.dragging) {
        renderMarqueeRectangle(state);
        applyMarqueeSelection();
      }

      marqueeSelection = null;
      marqueeRenderScheduled = false;
      document.getElementById('selection-marquee').classList.add('hidden');
      try {
        state.captureTarget.releasePointerCapture(state.pointerId);
      } catch {
        // 指针已在元素外释放时无需重复处理。
      }
      document.removeEventListener('pointermove', updateMarqueeSelection);
      document.removeEventListener('pointerup', finishMarqueeSelection);
      document.removeEventListener('pointercancel', finishMarqueeSelection);
    }

    function renderMarqueeRectangle(state) {
      const marquee = document.getElementById('selection-marquee');
      const left = Math.min(state.startX, state.currentX);
      const top = Math.min(state.startY, state.currentY);
      marquee.style.left = `${left}px`;
      marquee.style.top = `${top}px`;
      marquee.style.width = `${Math.abs(state.currentX - state.startX)}px`;
      marquee.style.height = `${Math.abs(state.currentY - state.startY)}px`;
      marquee.classList.remove('hidden');
    }

    function scheduleMarqueeSelectionRender() {
      if (marqueeRenderScheduled) return;
      marqueeRenderScheduled = true;
      requestAnimationFrame(applyMarqueeSelection);
    }

    function applyMarqueeSelection() {
      marqueeRenderScheduled = false;
      const state = marqueeSelection;
      if (!state?.dragging) return;

      const selectionRect = {
        left: Math.min(state.startX, state.currentX),
        right: Math.max(state.startX, state.currentX),
        top: Math.min(state.startY, state.currentY),
        bottom: Math.max(state.startY, state.currentY)
      };
      const intersectedIds = [...document.querySelectorAll(
        '#content-area [data-file-id]'
      )]
        .filter(element => rectanglesIntersect(
          selectionRect,
          element.getBoundingClientRect()
        ))
        .map(element => element.dataset.fileId);
      const nextIds = new Set(state.initialIds);
      intersectedIds.forEach(id => nextIds.add(id));

      if (setsEqual(nextIds, selectedFileIds)) return;
      selectedFileIds = nextIds;
      selectedFileId = intersectedIds.at(-1) ||
        state.initialSelectedFileId ||
        null;
      selectionAnchorId = intersectedIds.at(-1) ||
        state.initialAnchorId ||
        null;
      renderContent();
    }

    function rectanglesIntersect(left, right) {
      return !(
        left.right < right.left ||
        left.left > right.right ||
        left.bottom < right.top ||
        left.top > right.bottom
      );
    }

    function setsEqual(left, right) {
      return left.size === right.size &&
        [...left].every(value => right.has(value));
    }

    function clamp(value, minimum, maximum) {
      return Math.min(maximum, Math.max(minimum, value));
    }

    function clearSelection() {
      selectedFileId = null;
      selectedFileIds.clear();
      selectionAnchorId = null;
      document.getElementById('btn-delete').disabled = true;
      document.getElementById('btn-download-selected').classList.add('hidden');
    }

    function selectFile(id, event) {
      const toggle = Boolean(event?.metaKey || event?.ctrlKey);
      const range = Boolean(event?.shiftKey && selectionAnchorId);
      const selected = files.find(file => file.id === id);

      if (
        mobileViewQuery.matches &&
        selected?.type === 'folder' &&
        selectedFileId === id &&
        selectedFileIds.size === 1
      ) {
        void openFile(id);
        return;
      }

      if (mobileViewQuery.matches && selected?.type === 'folder') {
        showToast(`再次点击“${selected.name}”可打开，或点右侧更多操作`, 'info');
      }

      if (range) {
        const anchorIndex = files.findIndex(file => file.id === selectionAnchorId);
        const targetIndex = files.findIndex(file => file.id === id);
        if (anchorIndex !== -1 && targetIndex !== -1) {
          if (!toggle) selectedFileIds.clear();
          const start = Math.min(anchorIndex, targetIndex);
          const end = Math.max(anchorIndex, targetIndex);
          files.slice(start, end + 1).forEach(file => selectedFileIds.add(file.id));
        }
      } else if (toggle) {
        if (selectedFileIds.has(id)) selectedFileIds.delete(id);
        else selectedFileIds.add(id);
        selectionAnchorId = id;
      } else {
        selectedFileIds = new Set([id]);
        selectionAnchorId = id;
      }

      selectedFileId = selectedFileIds.has(id)
        ? id
        : [...selectedFileIds].at(-1) || null;
      renderContent();
    }

    function showContextMenu(event, fileId) {
      event.preventDefault();
      event.stopPropagation();
      if (fileId) {
        if (!selectedFileIds.has(fileId)) {
          selectedFileIds = new Set([fileId]);
          selectionAnchorId = fileId;
        }
        selectedFileId = fileId;
        renderContent();
      } else {
        clearSelection();
        renderContent();
      }

      const menu = document.getElementById('context-menu');
      const selection = files.filter(item => selectedFileIds.has(item.id));
      const hasSelection = selection.length > 0;
      const isSingleSelection = selection.length === 1;
      const selectedFiles = selection.filter(item => item.type === 'file');
      const selected = files.find(item => item.id === selectedFileId);
      const isFile = selected?.type === 'file';
      const isImage = isSingleSelection && selected?.iconType === 'image';
      menu.querySelector('[data-menu-action="open"]').classList.toggle(
        'hidden',
        !hasSelection || (!isSingleSelection && !selectedFiles.length)
      );
      menu.querySelector('[data-menu-action="copy"]').classList.toggle('hidden', !isSingleSelection);
      menu.querySelector('[data-menu-action="delete"]').classList.toggle('hidden', !hasSelection);
      menu.querySelector('[data-menu-action="copy-link"]').classList.toggle(
        'hidden',
        !isSingleSelection || !isFile
      );
      menu.querySelector('[data-menu-action="download"]').classList.toggle(
        'hidden',
        !isImage
      );
      menu.querySelector('[data-menu-label="open"]').innerText = isSingleSelection
        ? isImage ? '预览' : isFile ? '下载' : '打开'
        : `下载所选文件（${selectedFiles.length}）`;
      menu.querySelector('[data-menu-label="delete"]').innerText =
        isSingleSelection
          ? '移到废纸篓'
          : `将 ${selection.length} 个项目移到废纸篓`;
      menu.querySelectorAll('[data-menu-section="selection"]')
        .forEach(item => item.classList.toggle('hidden', !hasSelection));
      menu.querySelectorAll('[data-menu-section="tags"]')
        .forEach(item => item.classList.toggle('hidden', !isSingleSelection));
      renderContextTagOptions(selected);
      menu.querySelector('[data-menu-action="paste"]').disabled =
        !clipboardEntry || isVirtualView() || !canWriteCurrentStorage();
      menu.querySelector('[data-menu-action="create-folder"]').disabled =
        isVirtualView() || !canWriteCurrentStorage();
      menu.querySelector('[data-menu-action="upload"]').disabled =
        isVirtualView() || !canWriteCurrentStorage();
      menu.querySelector('[data-menu-action="delete"]').disabled =
        adminRequired && !adminToken;
      menu.classList.remove('hidden');

      const bounds = menu.getBoundingClientRect();
      if (mobileViewQuery.matches) {
        menu.style.left = '';
        menu.style.right = '';
        menu.style.top = '';
        menu.style.bottom = '';
        return;
      }
      const left = Math.min(event.clientX, window.innerWidth - bounds.width - 8);
      const top = Math.min(event.clientY, window.innerHeight - bounds.height - 8);
      menu.style.left = `${Math.max(8, left)}px`;
      menu.style.top = `${Math.max(8, top)}px`;
    }

    function hideContextMenu() {
      document.getElementById('context-menu').classList.add('hidden');
    }

    function renderContextTagOptions(file) {
      const selectedSlugs = new Set(file?.tags.map(tag => tag.slug) || []);
      const needsLogin = !canEditCurrentTags();
      document.getElementById('context-tag-options').innerHTML = availableTags.map(tag => {
        const selected = selectedSlugs.has(tag.slug);
        return `
          <button
            type="button"
            onclick="toggleSelectedTag(event, '${escapeHtml(tag.slug)}')"
            title="${escapeHtml(tag.name)}${needsLogin ? '（需要管理员登录）' : ''}"
            aria-label="${escapeHtml(tag.name)}${selected ? '，已添加' : ''}"
            class="context-tag-button relative rounded-full ring-offset-2 ring-offset-slate-900 transition hover:scale-110 ${selected ? 'ring-2 ring-white shadow-md' : ''}"
            style="background-color:${safeTagColor(tag.color)}"
          >
            ${selected ? '<span class="absolute inset-0 flex items-center justify-center text-[9px] font-bold text-white">✓</span>' : ''}
          </button>
        `;
      }).join('');
    }

    async function toggleSelectedTag(event, slug) {
      event.stopPropagation();
      if (!canEditCurrentTags()) {
        showToast('该存储位置的匿名权限为只读，不能修改标签', 'info');
        if (adminRequired) openAdminDialog();
        return;
      }
      const file = files.find(item => item.id === selectedFileId);
      if (!file) return;

      const current = new Set(file.tags.map(tag => tag.slug));
      if (current.has(slug)) current.delete(slug);
      else current.add(slug);

      try {
        const response = await apiRequest(`/${encodeURIComponent(file.id)}/tags`, {
          method: 'PUT',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ tags: [...current] })
        });
        const updated = normalizeFile(response.data);
        const index = files.findIndex(item => item.id === file.id);
        if (index !== -1) files[index] = updated;
        showToast(`已更新“${file.name}”的标签`, 'success');

        if (activeTag && !current.has(activeTag)) {
          hideContextMenu();
          await selectTag(activeTag);
        } else {
          renderContent();
          renderContextTagOptions(updated);
        }
      } catch (error) {
        showToast(`标签更新失败：${error.message}`, 'error');
      }
    }

    function handleMenuAction(action) {
      hideContextMenu();
      if (action === 'refresh') refreshContent();
      if (action === 'open' && selectedFileId) {
        if (selectedFileIds.size > 1) startSelectedDownloads();
        else openFile(selectedFileId);
      }
      if (action === 'download' && selectedFileId) {
        const file = files.find(item => item.id === selectedFileId);
        if (file?.type === 'file') downloadFileWithBrowser(file);
      }
      if (action === 'copy') copySelected();
      if (action === 'copy-link') copyFileLink();
      if (action === 'paste') pasteClipboard();
      if (action === 'create-folder') createFolder();
      if (action === 'upload') openUploadPicker();
      if (action === 'delete') deleteSelected();
    }

    function copySelected() {
      if (selectedFileIds.size !== 1) return;
      const file = files.find(item => item.id === selectedFileId);
      if (!file) return;
      clipboardEntry = {
        id: file.id,
        name: file.name,
        type: file.type
      };
      setStatus(`已复制“${file.name}”，可在目标文件夹粘贴`);
    }

    async function copyFileLink() {
      if (selectedFileIds.size !== 1) return;
      const file = files.find(item => item.id === selectedFileId);
      if (!file || file.type !== 'file') return;
      const isImage = file.iconType === 'image';
      const url = new URL(
        `${API_BASE}/${encodeURIComponent(file.id)}/${isImage ? 'preview' : 'download'}`,
        window.location.origin
      ).href;

      try {
        await writeClipboardText(url);
        setStatus(`已复制“${file.name}”的${isImage ? '预览' : '下载'}链接`);
        showToast(`${isImage ? '预览' : '下载'}链接已复制`, 'success');
      } catch (error) {
        showToast(`复制链接失败：${error.message}`, 'error');
      }
    }

    async function writeClipboardText(text) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      const copied = document.execCommand('copy');
      textarea.remove();
      if (!copied) throw new Error('浏览器不支持写入剪贴板');
    }

    async function pasteClipboard() {
      if (!canWriteCurrentStorage()) {
        showToast('该存储位置不允许匿名写入', 'info');
        return;
      }
      if (!clipboardEntry) return;
      if (isVirtualView()) {
        showToast('请先进入一个文件夹再粘贴', 'info');
        return;
      }

      try {
        setStatus(`正在粘贴 ${clipboardEntry.name}…`);
        await apiRequest(`/${encodeURIComponent(clipboardEntry.id)}/copy`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            storageLocationId: currentStorageLocationId,
            parentId: currentFolder().id
          })
        });
        showToast(`已粘贴“${clipboardEntry.name}”`, 'success');
        await loadFiles();
      } catch (error) {
        showToast(`粘贴失败：${error.message}`, 'error');
        renderContent();
      }
    }

    async function openFile(id) {
      const file = files.find(item => item.id === id);
      if (!file) return;
      if (file.type === 'folder') {
        if (isVirtualView()) {
          activeTag = null;
          clearSearchState();
          navigationHistory = [
            {
              id: null,
              name: storageLocations.find(
                item => item.id === currentStorageLocationId
              )?.name || '存储位置'
            },
            { id: file.id, name: file.name }
          ];
          historyIndex = 1;
          await loadFiles();
          return;
        }
        navigationHistory = navigationHistory.slice(0, historyIndex + 1);
        navigationHistory.push({ id: file.id, name: file.name });
        historyIndex++;
        await loadFiles();
        return;
      }

      if (file.iconType === 'image') {
        openImagePreview(file);
        return;
      }
      downloadFileWithBrowser(file);
    }

    function downloadFileWithBrowser(file) {
      const link = document.createElement('a');
      link.href = `${API_BASE}/${encodeURIComponent(file.id)}/download`;
      link.download = file.name;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function openImagePreview(file) {
      previewFileId = file.id;
      const dialog = document.getElementById('image-preview-dialog');
      const image = document.getElementById('image-preview-content');
      document.getElementById('image-preview-title').innerText = file.name;
      document.getElementById('image-preview-meta').innerText =
        `${file.displayType} · ${file.displaySize}`;
      document.getElementById('image-preview-loading').classList.remove('hidden');
      document.getElementById('image-preview-error').classList.add('hidden');
      image.classList.add('hidden');
      image.alt = file.name;
      image.dataset.fileId = file.id;
      const previewUrl = `${API_BASE}/${encodeURIComponent(file.id)}/preview`;
      image.src = getFileExtension(file) === 'gif'
        ? `${previewUrl}?animation=${Date.now()}`
        : previewUrl;
      dialog.classList.remove('hidden');
      dialog.classList.add('flex');
      requestAnimationFrame(() =>
        document.getElementById('btn-image-preview-close').focus()
      );
    }

    function closeImagePreview() {
      if (!previewFileId) return;
      previewFileId = null;
      const dialog = document.getElementById('image-preview-dialog');
      const image = document.getElementById('image-preview-content');
      dialog.classList.add('hidden');
      dialog.classList.remove('flex');
      image.removeAttribute('src');
      image.removeAttribute('data-file-id');
      image.classList.add('hidden');
    }

    function handleImagePreviewLoaded(event) {
      if (!previewFileId || event.currentTarget.dataset.fileId !== previewFileId) return;
      document.getElementById('image-preview-loading').classList.add('hidden');
      document.getElementById('image-preview-error').classList.add('hidden');
      event.currentTarget.classList.remove('hidden');
    }

    function handleImagePreviewError(event) {
      if (!previewFileId || event.currentTarget.dataset.fileId !== previewFileId) return;
      document.getElementById('image-preview-loading').classList.add('hidden');
      document.getElementById('image-preview-error').classList.remove('hidden');
      document.getElementById('image-preview-error-message').innerText =
        '文件可能已失效、超过下载限制，或图片格式不受浏览器支持。';
      event.currentTarget.classList.add('hidden');
    }

    function downloadPreviewImage() {
      const file = files.find(item => item.id === previewFileId);
      if (file) downloadFileWithBrowser(file);
    }

    async function startSelectedDownloads() {
      const selected = files.filter(file => selectedFileIds.has(file.id));
      const selectedFiles = selected.filter(file => file.type === 'file');
      const skippedFolders = selected.length - selectedFiles.length;

      if (!selectedFiles.length) {
        showToast('所选项目中没有可下载的文件', 'info');
        return;
      }
      if (selectedFiles.length === 1 && selected.length === 1) {
        openFile(selectedFiles[0].id);
        return;
      }
      if (!('showDirectoryPicker' in window)) {
        showToast('当前浏览器不支持直接写入本地目录，请使用最新版 Chromium 浏览器', 'error');
        return;
      }

      try {
        if (!downloadRunning) {
          downloadDirectory = await window.showDirectoryPicker({
            id: 'tgfs-downloads',
            mode: 'readwrite',
            startIn: 'downloads'
          });
        }

        const queuedIds = new Set(
          downloadQueue
            .filter(item => item.status === 'pending' || item.status === 'downloading')
            .map(item => item.fileId)
        );
        let added = 0;
        for (const file of selectedFiles) {
          if (queuedIds.has(file.id)) continue;
          downloadQueue.push({
            id: ++downloadSequence,
            fileId: file.id,
            name: file.name,
            size: Number(file.size) || 0,
            received: 0,
            status: 'pending',
            error: null,
            savedName: null
          });
          added++;
        }

        if (skippedFolders) {
          showToast(`已跳过 ${skippedFolders} 个文件夹，仅下载所选文件`, 'info');
        }
        if (!added) {
          showToast('所选文件已在下载队列中', 'info');
          return;
        }

        renderDownloadProgress();
        processDownloadQueue();
      } catch (error) {
        if (error.name !== 'AbortError') {
          showToast(`无法开始下载：${error.message}`, 'error');
        }
      }
    }

    async function processDownloadQueue() {
      if (downloadRunning || !downloadDirectory) return;
      downloadRunning = true;

      let item;
      while ((item = downloadQueue.find(entry => entry.status === 'pending'))) {
        item.status = 'downloading';
        item.received = 0;
        renderDownloadProgress();
        setStatus(`正在下载：${item.name}`);

        try {
          await downloadOneToDirectory(item);
          item.status = 'completed';
          item.received = item.size || item.received;
        } catch (error) {
          item.status = error.name === 'AbortError' ? 'cancelled' : 'failed';
          item.error = error.name === 'AbortError' ? '下载已取消' : error.message;
        }
        renderDownloadProgress();
      }

      downloadRunning = false;
      currentDownloadController = null;
      const failed = downloadQueue.filter(item => item.status === 'failed').length;
      const cancelled = downloadQueue.filter(item => item.status === 'cancelled').length;
      const suffix = [
        failed ? `${failed} 个失败` : '',
        cancelled ? `${cancelled} 个已取消` : ''
      ].filter(Boolean).join('，');
      setStatus(suffix ? `下载队列结束，${suffix}` : '所有文件下载完成');
      showToast(
        suffix ? `下载队列结束，${suffix}` : '所有文件已保存到所选目录',
        failed ? 'error' : cancelled ? 'info' : 'success'
      );
    }

    async function downloadOneToDirectory(item) {
      currentDownloadController = new AbortController();
      let savedName = null;

      try {
        const response = await fetch(
          `${API_BASE}/${encodeURIComponent(item.fileId)}/download`,
          { signal: currentDownloadController.signal }
        );
        if (!response.ok) {
          let message = `请求失败（HTTP ${response.status}）`;
          try {
            const body = await response.json();
            message = body?.error?.message || message;
          } catch {
            // 非 JSON 错误响应继续使用 HTTP 状态。
          }
          throw new Error(message);
        }
        if (!response.body) throw new Error('浏览器未返回文件流');

        const target = await createUniqueDownloadFile(
          downloadDirectory,
          sanitizeDownloadFilename(item.name)
        );
        savedName = target.name;
        item.savedName = savedName;
        const writable = await target.handle.createWritable();
        const contentLength = Number(response.headers.get('content-length'));
        if (Number.isFinite(contentLength) && contentLength > 0) {
          item.size = contentLength;
        }

        const progressStream = new TransformStream({
          transform(chunk, controller) {
            item.received += chunk.byteLength;
            scheduleDownloadProgressRender();
            controller.enqueue(chunk);
          }
        });

        await response.body
          .pipeThrough(progressStream)
          .pipeTo(writable, { signal: currentDownloadController.signal });
      } catch (error) {
        if (savedName) {
          try {
            await downloadDirectory.removeEntry(savedName);
          } catch {
            // 无法移除未完成文件时保留浏览器给出的文件系统状态。
          }
        }
        throw error;
      } finally {
        currentDownloadController = null;
      }
    }

    async function createUniqueDownloadFile(directory, requestedName) {
      const extensionIndex = requestedName.lastIndexOf('.');
      const hasExtension = extensionIndex > 0;
      const base = hasExtension ? requestedName.slice(0, extensionIndex) : requestedName;
      const extension = hasExtension ? requestedName.slice(extensionIndex) : '';

      for (let index = 0; index < 10000; index++) {
        const name = index === 0
          ? requestedName
          : `${base} (${index})${extension}`;
        try {
          await directory.getFileHandle(name);
        } catch (error) {
          if (error.name === 'NotFoundError') {
            return {
              name,
              handle: await directory.getFileHandle(name, { create: true })
            };
          }
          if (error.name !== 'TypeMismatchError') throw error;
        }
      }
      throw new Error('保存目录中存在过多同名文件');
    }

    function sanitizeDownloadFilename(name) {
      const safe = String(name)
        .replace(/[\\/:*?"<>|\0]/g, '_')
        .replace(/^\.+$/, '_')
        .trim();
      return safe || '未命名文件';
    }

    function stopDownloadQueue() {
      downloadQueue
        .filter(item => item.status === 'pending')
        .forEach(item => {
          item.status = 'cancelled';
          item.error = '下载已取消';
        });
      currentDownloadController?.abort();
      renderDownloadProgress();
    }

    function clearFinishedDownloads() {
      downloadQueue = downloadQueue.filter(
        item => item.status === 'pending' || item.status === 'downloading'
      );
      renderDownloadProgress();
    }

    function renderDownloadProgress() {
      downloadRenderScheduled = false;
      const panel = document.getElementById('download-panel');
      const list = document.getElementById('download-list');
      if (!downloadQueue.length) {
        panel.classList.add('hidden');
        return;
      }
      panel.classList.remove('hidden');

      const completed = downloadQueue.filter(item => item.status === 'completed').length;
      const failed = downloadQueue.filter(item => item.status === 'failed').length;
      const cancelled = downloadQueue.filter(item => item.status === 'cancelled').length;
      const totalPercent = calculateTotalDownloadPercent();
      document.getElementById('download-summary').innerText =
        `${completed}/${downloadQueue.length} 已完成` +
        `${failed ? `，${failed} 个失败` : ''}` +
        `${cancelled ? `，${cancelled} 个已取消` : ''} · ${totalPercent}%`;
      document.getElementById('download-total-progress').style.width = `${totalPercent}%`;
      document.getElementById('btn-stop-downloads').disabled =
        !downloadQueue.some(item => item.status === 'pending' || item.status === 'downloading');

      list.innerHTML = downloadQueue.map(item => {
        const progress = downloadDisplayPercent(item);
        const status = downloadStatusText(item);
        const barColor = item.status === 'failed'
          ? 'bg-rose-500'
          : item.status === 'completed'
            ? 'bg-emerald-500'
            : item.status === 'cancelled'
              ? 'bg-slate-500'
              : 'bg-blue-500';
        return `
          <div class="rounded-xl px-2.5 py-2 hover:bg-white/5 transition-colors">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0 flex-1">
                <div class="truncate text-slate-200 font-medium">${escapeHtml(item.name)}</div>
                <div class="mt-0.5 truncate text-[10px] ${item.status === 'failed' ? 'text-rose-400 font-medium' : 'text-slate-400'}">${escapeHtml(status)}</div>
              </div>
              <div class="shrink-0 text-[10px] font-semibold text-slate-400">${progress}%</div>
            </div>
            <div class="mt-2 h-1 overflow-hidden rounded-full bg-white/10">
              <div class="h-full rounded-full transition-all duration-300 ${barColor}" style="width: ${progress}%"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    function scheduleDownloadProgressRender() {
      if (downloadRenderScheduled) return;
      downloadRenderScheduled = true;
      requestAnimationFrame(renderDownloadProgress);
    }

    function downloadDisplayPercent(item) {
      if (item.status === 'completed') return 100;
      if (!item.size) return 0;
      return Math.min(100, Math.round(item.received / item.size * 100));
    }

    function calculateTotalDownloadPercent() {
      const totalWeight = downloadQueue.reduce(
        (sum, item) => sum + Math.max(item.size, 1),
        0
      );
      if (!totalWeight) return 0;
      const progressWeight = downloadQueue.reduce(
        (sum, item) =>
          sum + Math.max(item.size, 1) * downloadDisplayPercent(item) / 100,
        0
      );
      return Math.round(progressWeight / totalWeight * 100);
    }

    function downloadStatusText(item) {
      if (item.status === 'pending') return '等待下载';
      if (item.status === 'downloading') {
        return `正在写入 · ${formatBytes(item.received)} / ${formatBytes(item.size)}`;
      }
      if (item.status === 'completed') {
        return item.savedName && item.savedName !== item.name
          ? `下载完成 · 已保存为“${item.savedName}”`
          : '下载完成';
      }
      if (item.status === 'cancelled') return '下载已取消';
      return `下载失败 · ${item.error || '未知错误'}`;
    }

    function createFolder() {
      if (!canWriteCurrentStorage()) {
        showToast('该存储位置不允许匿名写入', 'info');
        return;
      }
      if (isVirtualView()) {
        showToast('请先进入一个文件夹再新建项目', 'info');
        return;
      }
      const dialog = document.getElementById('folder-dialog');
      const input = document.getElementById('folder-name-input');
      const error = document.getElementById('folder-dialog-error');
      input.value = '';
      error.innerText = '';
      error.classList.add('hidden');
      dialog.classList.remove('hidden');
      dialog.classList.add('flex');
      requestAnimationFrame(() => input.focus());
    }

    function closeFolderDialog() {
      if (creatingFolder) return;
      const dialog = document.getElementById('folder-dialog');
      dialog.classList.add('hidden');
      dialog.classList.remove('flex');
    }

    async function submitFolderDialog() {
      if (creatingFolder) return;
      const input = document.getElementById('folder-name-input');
      const error = document.getElementById('folder-dialog-error');
      const confirmButton = document.getElementById('btn-folder-confirm');
      const cancelButton = document.getElementById('btn-folder-cancel');
      const name = input.value.trim();

      if (!name) {
        error.innerText = '文件夹名称不能为空';
        error.classList.remove('hidden');
        input.focus();
        return;
      }

      creatingFolder = true;
      confirmButton.disabled = true;
      cancelButton.disabled = true;
      confirmButton.innerText = '正在创建…';
      error.classList.add('hidden');

      try {
        await apiRequest('/folder', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            name,
            storageLocationId: currentStorageLocationId,
            parentId: currentFolder().id
          })
        });
        creatingFolder = false;
        closeFolderDialog();
        setStatus(`已创建文件夹“${name}”`);
        showToast(`已创建文件夹“${name}”`, 'success');
        await loadFiles();
      } catch (requestError) {
        error.innerText = requestError.message;
        error.classList.remove('hidden');
        input.focus();
      } finally {
        creatingFolder = false;
        confirmButton.disabled = false;
        cancelButton.disabled = false;
        confirmButton.innerText = '创建';
      }
    }

    function uploadFiles(fileList) {
      if (!canWriteCurrentStorage()) {
        showToast('该存储位置不允许匿名写入', 'info');
        return;
      }
      const selected = [...(fileList || [])];
      if (!selected.length) return;
      if (isVirtualView()) {
        showToast('请先进入一个文件夹再上传', 'info');
        return;
      }

      const target = currentFolder();
      for (const file of selected) {
        uploadQueue.push({
          id: ++uploadSequence,
          file,
          name: file.name,
          size: file.size,
          targetStorageLocationId: currentStorageLocationId,
          targetParentId: target.id,
          targetName: target.name,
          status: 'pending',
          thumbnail: null,
          networkPercent: 0,
          error: null
        });
      }
      if (uploadInput) uploadInput.value = '';
      renderUploadProgress();
      processUploadQueue();
    }

    async function processUploadQueue() {
      if (uploadRunning) return;
      uploadRunning = true;

      let item;
      while ((item = uploadQueue.find(entry => entry.status === 'pending'))) {
        item.status = 'preparing';
        item.networkPercent = 0;
        renderUploadProgress();
        setStatus(`正在准备上传：${item.name}`);

        try {
          try {
            item.thumbnail = await createImageThumbnail(item.file);
          } catch {
            item.thumbnail = null;
          }
          item.status = 'uploading';
          renderUploadProgress();
          setStatus(`正在上传：${item.name}`);
          await uploadOneWithProgress(item);
          item.status = 'completed';
          item.networkPercent = 100;
        } catch (error) {
          item.status = 'failed';
          item.error = error.message;
        }
        renderUploadProgress();
      }

      uploadRunning = false;
      const failed = uploadQueue.filter(entry => entry.status === 'failed').length;
      setStatus(failed ? `上传队列完成，${failed} 个文件失败` : '所有文件上传完成');
      showToast(
        failed ? `上传完成，${failed} 个文件失败` : '所有文件上传完成',
        failed ? 'error' : 'success'
      );
      await loadFiles();
    }

    function uploadOneWithProgress(item) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        const uploadParams = new URLSearchParams({
          storageLocationId: item.targetStorageLocationId
        });
        xhr.open('POST', `${API_BASE}/upload?${uploadParams.toString()}`);
        if (adminToken) {
          xhr.setRequestHeader('authorization', `Bearer ${adminToken}`);
        }

        xhr.upload.onprogress = event => {
          item.status = 'uploading';
          if (event.lengthComputable && event.total > 0) {
            item.networkPercent = Math.min(
              100,
              Math.round(event.loaded / event.total * 100)
            );
          }
          renderUploadProgress();
        };

        xhr.upload.onload = () => {
          item.status = 'processing';
          item.networkPercent = 100;
          renderUploadProgress();
          setStatus(`正在存入 Telegram：${item.name}`);
        };

        xhr.onload = () => {
          let body = null;
          try {
            body = xhr.responseText ? JSON.parse(xhr.responseText) : null;
          } catch {
            body = null;
          }

          if (xhr.status >= 200 && xhr.status < 300) {
            resolve(body);
          } else {
            if (xhr.status === 401) clearAdminSession(true);
            reject(new Error(body?.error?.message || `请求失败（HTTP ${xhr.status}）`));
          }
        };

        xhr.onerror = () => reject(new Error('网络连接失败'));
        xhr.onabort = () => reject(new Error('上传已取消'));

        const form = new FormData();
        if (item.targetParentId !== null) {
          form.append('parentId', item.targetParentId);
        }
        if (item.thumbnail) {
          form.append(
            'thumbnail',
            item.thumbnail,
            `${item.name}.thumbnail.jpg`
          );
        }
        form.append('file', item.file);
        xhr.send(form);
      });
    }

    async function createImageThumbnail(file) {
      if (
        !file.type.startsWith('image/') ||
        typeof createImageBitmap !== 'function'
      ) {
        return null;
      }

      let bitmap;
      try {
        bitmap = await createImageBitmap(file, {
          imageOrientation: 'from-image'
        });
      } catch {
        bitmap = await createImageBitmap(file);
      }

      try {
        const maxDimension = 320;
        const scale = Math.min(
          1,
          maxDimension / Math.max(bitmap.width, bitmap.height)
        );
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(bitmap.width * scale));
        canvas.height = Math.max(1, Math.round(bitmap.height * scale));
        const context = canvas.getContext('2d');
        if (!context) return null;
        context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        return new Promise(resolve => {
          canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.8);
        });
      } finally {
        bitmap.close();
      }
    }

    function renderUploadProgress() {
      const panel = document.getElementById('upload-panel');
      const list = document.getElementById('upload-list');
      if (!uploadQueue.length) {
        panel.classList.add('hidden');
        return;
      }
      panel.classList.remove('hidden');

      const completed = uploadQueue.filter(item => item.status === 'completed').length;
      const failed = uploadQueue.filter(item => item.status === 'failed').length;
      const totalPercent = calculateTotalUploadPercent();
      document.getElementById('upload-summary').innerText =
        `${completed}/${uploadQueue.length} 已完成` +
        `${failed ? `，${failed} 个失败` : ''} · ${totalPercent}%`;
      document.getElementById('upload-total-progress').style.width = `${totalPercent}%`;

      list.innerHTML = uploadQueue.map(item => {
        const progress = uploadDisplayPercent(item);
        const status = uploadStatusText(item);
        const barColor = item.status === 'failed'
          ? 'bg-rose-500'
          : item.status === 'completed'
            ? 'bg-emerald-500'
            : 'bg-blue-500';
        return `
          <div class="rounded-xl px-2.5 py-2 hover:bg-white/5 transition-colors">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0 flex-1">
                <div class="truncate text-slate-200 font-medium">${escapeHtml(item.name)}</div>
                <div class="mt-0.5 truncate text-[10px] ${item.status === 'failed' ? 'text-rose-400 font-medium' : 'text-slate-400'}">${escapeHtml(status)}</div>
              </div>
              <div class="shrink-0 text-[10px] font-semibold text-slate-400">${progress}%</div>
            </div>
            <div class="mt-2 h-1 overflow-hidden rounded-full bg-white/10">
              <div class="h-full rounded-full transition-all duration-300 ${barColor}" style="width: ${progress}%"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    function uploadDisplayPercent(item) {
      if (item.status === 'completed') return 100;
      if (item.status === 'processing') return 99;
      if (item.status === 'uploading') return Math.min(98, item.networkPercent);
      return 0;
    }

    function calculateTotalUploadPercent() {
      const totalWeight = uploadQueue.reduce((sum, item) => sum + Math.max(item.size, 1), 0);
      if (!totalWeight) return 0;
      const progressWeight = uploadQueue.reduce(
        (sum, item) => sum + Math.max(item.size, 1) * uploadDisplayPercent(item) / 100,
        0
      );
      return Math.round(progressWeight / totalWeight * 100);
    }

    function uploadStatusText(item) {
      if (item.status === 'pending') return '等待上传';
      if (item.status === 'preparing') return '生成缩略图…';
      if (item.status === 'uploading') {
        return `发送文件 · ${formatBytes(item.size * item.networkPercent / 100)} / ${formatBytes(item.size)}`;
      }
      if (item.status === 'processing') return '正在打包并传输至 Telegram…';
      if (item.status === 'completed') return '上传完成';
      return `上传失败 · ${item.error || '未知错误'}`;
    }

    function clearFinishedUploads() {
      uploadQueue = uploadQueue.filter(item => item.status !== 'completed' && item.status !== 'failed');
      renderUploadProgress();
    }

    function deleteSelected() {
      if (!requireAdmin()) return;
      const selected = files.filter(file => selectedFileIds.has(file.id));
      if (!selected.length) return;

      pendingDeleteItems = selected;
      const dialog = document.getElementById('delete-dialog');
      const error = document.getElementById('delete-dialog-error');
      error.innerText = '';
      error.classList.add('hidden');
      document.getElementById('delete-dialog-message').innerText =
        selected.length === 1
          ? `确定要将“${selected[0].name}”移到废纸篓吗？`
          : `确定要将选中的 ${selected.length} 个项目移到废纸篓吗？`;

      dialog.classList.remove('hidden');
      dialog.classList.add('flex');
      requestAnimationFrame(() =>
        document.getElementById('btn-delete-confirm').focus()
      );
    }

    function closeDeleteDialog() {
      if (deletingFile) return;
      pendingDeleteItems = [];
      const dialog = document.getElementById('delete-dialog');
      dialog.classList.add('hidden');
      dialog.classList.remove('flex');
    }

    async function submitDeleteDialog() {
      if (deletingFile || !pendingDeleteItems.length) return;
      const confirmButton = document.getElementById('btn-delete-confirm');
      const cancelButton = document.getElementById('btn-delete-cancel');
      const error = document.getElementById('delete-dialog-error');

      deletingFile = true;
      confirmButton.disabled = true;
      cancelButton.disabled = true;
      confirmButton.innerText = '正在删除…';
      error.classList.add('hidden');

      const items = [...pendingDeleteItems];
      let successCount = 0;
      let lastError = null;

      for (const item of items) {
        try {
          await apiRequest(`/${encodeURIComponent(item.id)}`, { method: 'DELETE' });
          successCount++;
        } catch (requestError) {
          lastError = requestError;
        }
      }

      deletingFile = false;
      confirmButton.disabled = false;
      cancelButton.disabled = false;
      confirmButton.innerText = '移到废纸篓';

      if (successCount === items.length) {
        closeDeleteDialog();
        clearSelection();
        showToast(
          items.length === 1
            ? `已删除“${items[0].name}”`
            : `已删除 ${items.length} 个项目`,
          'success'
        );
        await refreshContent();
      } else {
        error.innerText = lastError?.message || '部分项目删除失败';
        error.classList.remove('hidden');
        if (successCount > 0) {
          clearSelection();
          await refreshContent();
        }
      }
    }

    function handleSearch() {
      if (searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        const query = document.getElementById('search-input').value.trim();
        if (query) {
          performGlobalSearch(query);
        } else if (searchQuery) {
          clearSearchState();
          loadFiles();
        }
      }, 300);
    }

    function handleSortChange() {
      const select = document.getElementById('sort-select');
      const [nextSortBy, nextSortOrder] = select.value.split(':');
      sortBy = nextSortBy;
      sortOrder = nextSortOrder;
      refreshContent();
    }

    function handleInfiniteScroll() {
      const container = document.getElementById('content-area');
      if (loading || !hasMore) return;
      if (container.scrollHeight - container.scrollTop - container.clientHeight < 120) {
        if (searchQuery) {
          performGlobalSearch(searchQuery, true);
        } else if (activeTag) {
          selectTag(activeTag, true);
        } else {
          loadFiles(true);
        }
      }
    }

    function navigateBack() {
      if (historyIndex <= 0) return;
      historyIndex--;
      activeTag = null;
      clearSearchState();
      loadFiles();
    }

    function navigateForward() {
      if (historyIndex >= navigationHistory.length - 1) return;
      historyIndex++;
      activeTag = null;
      clearSearchState();
      loadFiles();
    }

    function navigateToHistory(index) {
      if (index < 0 || index > historyIndex) return;
      historyIndex = index;
      activeTag = null;
      clearSearchState();
      loadFiles();
    }

    function navigateToRoot() {
      navigateToHistory(0);
    }

    function updateNavigationButtons() {
      document.getElementById('btn-back').disabled = historyIndex <= 0;
      document.getElementById('btn-forward').disabled =
        historyIndex >= navigationHistory.length - 1;
    }

    async function navigateToStorageLocation(id) {
      if (id === currentStorageLocationId && !activeTag && !searchQuery) return;
      currentStorageLocationId = id;
      const location = storageLocations.find(item => item.id === id);
      activeTag = null;
      clearSearchState();
      navigationHistory = [{
        id: null,
        name: location?.name || '存储位置'
      }];
      historyIndex = 0;
      renderSidebar();
      renderBreadcrumbs();
      await loadTags();
      await loadFiles();
    }

    function openStorageDialog(id = null) {
      if (!requireAdmin()) return;
      editingStorageLocationId = id;
      const dialog = document.getElementById('storage-dialog');
      const title = document.getElementById('storage-dialog-title');
      const nameInput = document.getElementById('storage-name-input');
      const accessSelect = document.getElementById('storage-access-select');
      const error = document.getElementById('storage-dialog-error');
      const deleteBtn = document.getElementById('btn-storage-delete');

      error.innerText = '';
      error.classList.add('hidden');

      if (id) {
        const item = storageLocations.find(loc => loc.id === id);
        title.innerText = '编辑存储位置';
        nameInput.value = item?.name || '';
        accessSelect.value = item?.anonymousAccess || 'hidden';
        deleteBtn.classList.remove('hidden');
      } else {
        title.innerText = '新增存储位置';
        nameInput.value = '';
        accessSelect.value = 'hidden';
        deleteBtn.classList.add('hidden');
      }

      dialog.classList.remove('hidden');
      dialog.classList.add('flex');
      setTimeout(() => nameInput.focus(), 0);
    }

    function closeStorageDialog() {
      editingStorageLocationId = null;
      const dialog = document.getElementById('storage-dialog');
      dialog.classList.add('hidden');
      dialog.classList.remove('flex');
    }

    async function saveStorageLocation() {
      if (!requireAdmin()) return;
      const nameInput = document.getElementById('storage-name-input');
      const accessSelect = document.getElementById('storage-access-select');
      const error = document.getElementById('storage-dialog-error');
      const name = nameInput.value.trim();

      if (!name) {
        error.innerText = '存储位置名称不能为空';
        error.classList.remove('hidden');
        return;
      }

      try {
        if (editingStorageLocationId) {
          await apiRequest(`/api/storage-locations/${encodeURIComponent(editingStorageLocationId)}`, {
            method: 'PATCH',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ name, anonymousAccess: accessSelect.value })
          });
          showToast('已更新存储位置', 'success');
        } else {
          await apiRequest('/api/storage-locations', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ name, anonymousAccess: accessSelect.value })
          });
          showToast('已创建存储位置', 'success');
        }
        closeStorageDialog();
        await loadStorageLocations();
        await loadTags();
        renderSidebar();
        renderBreadcrumbs();
      } catch (err) {
        error.innerText = err.message;
        error.classList.remove('hidden');
      }
    }

    async function deleteStorageLocation() {
      if (!editingStorageLocationId || !requireAdmin()) return;
      try {
        await apiRequest(`/api/storage-locations/${encodeURIComponent(editingStorageLocationId)}`, {
          method: 'DELETE'
        });
        showToast('已删除存储位置', 'success');
        closeStorageDialog();
        currentStorageLocationId = null;
        await loadStorageLocations();
        await loadTags();
        renderSidebar();
        await loadFiles();
      } catch (err) {
        const error = document.getElementById('storage-dialog-error');
        error.innerText = err.message;
        error.classList.remove('hidden');
      }
    }

    function setStatus(text) {
      document.getElementById('status-info').innerText = text;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        info: 'bg-slate-900/90 border-slate-700/80 text-slate-200',
        success: 'bg-emerald-950/90 border-emerald-700/80 text-emerald-200',
        error: 'bg-rose-950/90 border-rose-700/80 text-rose-200'
      };
      toast.className = `flex items-center gap-2.5 rounded-xl border px-4 py-3 text-xs shadow-xl backdrop-blur-xl transition-all duration-300 transform translate-y-2 opacity-0 ${colors[type] || colors.info}`;
      toast.innerText = message;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function formatBytes(value) {
      const bytes = Number(value);
      if (!Number.isFinite(bytes) || bytes <= 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.min(
        Math.floor(Math.log(bytes) / Math.log(k)),
        sizes.length - 1
      );
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function formatDate(dateString) {
      if (!dateString) return '--';
      const date = new Date(dateString);
      if (isNaN(date.getTime())) return '--';
      return date.toLocaleDateString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function totalFileSize(fileList) {
      return fileList.reduce((sum, item) => sum + (Number(item.size) || 0), 0);
    }

    function safeTagColor(color) {
      return color && /^#[0-9A-F]{6}$/i.test(color) ? color : '#3B82F6';
    }

    function escapeHtml(string) {
      if (!string) return '';
      return String(string)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
